 <!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Relevamiento de Stock</title>

<style>
:root{
  --ink:#1c2b24;
  --paper:#f6f4ee;
  --line:#d8d2c2;
  --brand:#2f5d4f;
  --brand-dark:#1f4136;
  --brand-soft:#e4ede9;
  --amber:#c98a2c;
  --amber-soft:#f6e9d3;
  --red:#a63a3a;
  --red-soft:#f5e3e0;
  --green:#2f7d4f;
  --radius:10px;
  font-size:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--paper);color:var(--ink);-webkit-tap-highlight-color:transparent;}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 40px rgba(0,0,0,.06);}
header.top{background:var(--brand-dark);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;}
header.top .mark{width:30px;height:30px;border-radius:7px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--brand-dark);font-size:15px;flex:none;}
header.top .titles{flex:1;min-width:0;}
header.top h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px;}
header.top .sub{font-size:11.5px;opacity:.75;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
header.top button.back{background:none;border:none;color:#fff;font-size:20px;padding:4px 6px;cursor:pointer;line-height:1;}
main{flex:1;padding:18px 18px 90px;}
h2.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--brand);margin:0 0 12px;font-weight:700;}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:#5b6660;margin-bottom:5px;font-weight:600;}
input[type=text],input[type=number],input[type=search],input[type=password],select,textarea{
  width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fdfcf9;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand);}
button.btn{border:none;border-radius:8px;padding:12px 16px;font-size:14.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;letter-spacing:.01em;}
button.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:active{background:var(--brand-dark);}
.btn-outline{background:#fff;color:var(--brand);border:1.5px solid var(--brand);}
.btn-ghost{background:var(--brand-soft);color:var(--brand-dark);}
.btn-danger{background:var(--red-soft);color:var(--red);}
.btn-amber{background:var(--amber);color:#3a2500;}
.row-btns{display:flex;gap:10px;margin-top:14px;}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fdfcf9;cursor:pointer;}
.vendor-group{margin-bottom:18px;}
.vendor-heading{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 8px;border-bottom:1.5px solid var(--brand);margin-bottom:10px;}
.vendor-heading span:first-child{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--brand-dark);}
.vendor-phone{font-size:11.5px;color:#6b756f;font-weight:600;}
.list-item:active{background:var(--brand-soft);}
.list-item .meta{font-size:12px;color:#6b756f;margin-top:2px;}
.chev{color:#9aa39c;font-size:18px;}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:100px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;}
.badge-progress{background:var(--amber-soft);color:#8a5a10;}
.badge-pending{background:var(--amber-soft);color:#8a5a10;}
.badge-approved{background:var(--brand-soft);color:var(--brand-dark);}
.badge-rejected{background:var(--red-soft);color:var(--red);}
.badge-done{background:#e6e6e6;color:#444;}
.badge-red{background:var(--red-soft);color:var(--red);}
.badge-amber{background:var(--amber-soft);color:#8a5a10;}
.badge-green{background:var(--brand-soft);color:var(--green);}
.empty{text-align:center;padding:40px 10px;color:#8a9188;}
.empty .big{font-size:34px;margin-bottom:8px;}
details.cat-block{margin-bottom:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fdfcf9;}
details.cat-block summary{list-style:none;cursor:pointer;padding:11px 14px;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--brand-dark);font-weight:700;display:flex;justify-content:space-between;align-items:center;background:var(--brand-soft);}
details.cat-block summary::-webkit-details-marker{display:none;}
details.cat-block summary .arrow{transition:transform .15s;font-size:11px;color:var(--brand);}
details.cat-block[open] summary .arrow{transform:rotate(90deg);}
details.cat-block summary .count{font-weight:600;text-transform:none;letter-spacing:0;font-size:11px;color:var(--brand);}
.cat-body{padding:4px 14px 6px;}
.sku-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);}
.sku-row:last-child{border-bottom:none;}
.sku-row .name{flex:1;font-size:13.5px;line-height:1.3;}
.sku-row .name b{display:block;font-size:13px;}
.sku-row .name span{color:#8a9188;font-size:12px;}
.sku-row input{width:74px;text-align:center;padding:9px 4px;}
.gps-box{display:flex;align-items:center;gap:10px;padding:12px;border:1px dashed var(--line);border-radius:8px;background:#fbfaf6;}
.gps-box .ok{color:var(--brand);font-weight:700;}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.photo-slot{aspect-ratio:1/1;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#fbfaf6;font-size:11px;color:#8a9188;text-align:center;padding:4px;}
.photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.photo-slot input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.photo-slot .lbl{pointer-events:none;}
.photo-slot.filled .lbl{display:none;}
.sig-pad{border:1.5px dashed var(--line);border-radius:8px;background:#fdfcf9;touch-action:none;width:100%;height:180px;display:block;}
.hint{font-size:12px;color:#8a9188;margin-top:6px;line-height:1.4;}
.total-pill{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--brand-soft);border-radius:8px;font-size:13.5px;font-weight:700;color:var(--brand-dark);margin-bottom:10px;}
.tabbar{position:sticky;bottom:0;display:flex;border-top:1px solid var(--line);background:#fff;z-index:20;}
.tabbar button{flex:1;background:none;border:none;padding:11px 4px 9px;font-size:11px;color:#8a9188;font-weight:600;cursor:pointer;}
.tabbar button.active{color:var(--brand);}
.tabbar .ic{display:block;font-size:18px;margin-bottom:2px;}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--brand-dark);color:#fff;padding:10px 18px;border-radius:100px;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90%;text-align:center;}
.mini-note{background:var(--amber-soft);border:1px solid #e6cf9e;border-radius:8px;padding:10px 12px;font-size:12px;color:#7a5310;margin-bottom:14px;line-height:1.5;}
.check-row{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fdfcf9;margin-bottom:12px;}
.check-row input{width:20px;height:20px;margin-top:1px;flex:none;}
.check-row label{font-size:13.5px;line-height:1.4;}
.foot-actions{display:flex;gap:10px;margin-top:16px;}
.city-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.city-btn{border:1.5px solid var(--line);background:#fdfcf9;border-radius:10px;padding:20px 8px;text-align:center;font-weight:700;font-size:15px;color:var(--brand-dark);cursor:pointer;}
.city-btn.active{border-color:var(--brand);background:var(--brand-soft);}
.metric{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--line);}
.metric:last-child{border-bottom:none;}
.metric .lbl{font-size:12.5px;color:#5b6660;}
.metric .val{font-size:16px;font-weight:700;color:var(--brand-dark);}
.bar-row{margin-bottom:10px;}
.bar-row .top{display:flex;justify-content:space-between;font-size:12px;color:#556;margin-bottom:4px;}
.bar-track{height:8px;border-radius:5px;background:var(--brand-soft);overflow:hidden;}
.bar-fill{height:100%;background:var(--brand);border-radius:5px;}
.risk-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.risk-item:last-child{border-bottom:none;}
.risk-item .name{font-weight:600;}
.risk-item .sub{font-size:11.5px;color:#8a9188;}
</style>
</head>

  meses: ["MAY","JUN","JUL","AGO"],
  CBBA: [7441, 8642, 13283, 17355],
  LPZ: [25308, 21580, 17500, 11731],

  SUR_COMBINADO: [10496, 4323, 8807, 7979]

function historicoParaCiudad(ciudad){
  if(ciudad===NACIONAL){
    return HISTORICO_MENSUAL.meses.map((m,i)=> HISTORICO_MENSUAL.CBBA[i]+HISTORICO_MENSUAL.LPZ[i]+HISTORICO_MENSUAL.SCZ[i]+HISTORICO_MENSUAL.SUR_COMBINADO[i]);

}

const LS_PREFIX = "relevamiento_stock_";
function tieneStorageClaude(){
  try{ return typeof window!=="undefined" && !!window.storage && typeof window.storage.get==="function"; }
  catch(e){ return false; }
}
function tieneLocalStorage(){
  try{ return typeof window!=="undefined" && !!window.localStorage; }
  catch(e){ return false; }
}

const DB_LOCAL = {
  async _get(key, fallback){
    if(tieneStorageClaude()){
      try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : fallback; }
      catch(e){ /* si falla, seguimos probando otras opciones abajo */ }
    }
    if(tieneLocalStorage()){
      try{ const raw = window.localStorage.getItem(LS_PREFIX+key); return raw!=null ? JSON.parse(raw) : fallback; }
      catch(e){ return fallback; }
    }
    return fallback;
  },
  async _set(key, value){
    if(tieneStorageClaude()){
      try{ await window.storage.set(key, JSON.stringify(value), true); return; }
      catch(e){ /* si falla, seguimos probando otras opciones abajo */ }
    }
    if(tieneLocalStorage()){
      try{ window.localStorage.setItem(LS_PREFIX+key, JSON.stringify(value)); }catch(e){}
    }
  },
  async getAll(){
    const clientes = await this._get("clientes", []);
    const relevamientos = await this._get("relevamientos", {});
    return { clientes, relevamientos };
  },
  async saveClientes(clientes){ await this._set("clientes", clientes); },
  async saveRelevamiento(almacenId, clienteId, data){
    const rel = await this._get("relevamientos", {});
    rel[almacenId] = data;
    await this._set("relevamientos", rel);
  },
  async uploadPhoto(almacenId, clienteId, slot, dataUrl){
    // En modo prueba no hay Drive: la foto se guarda tal cual (base64) en el registro.
    return { ok:true, url: dataUrl };
  }
};

const DB_REMOTE = {
  async getAll(){
    let res;
    try{ res = await fetch(API_URL + "?action=getAll"); }
    catch(e){ throw new Error("No se pudo conectar al backend (red/CORS): "+e.message); }
    if(!res.ok) throw new Error("El backend respondió con error HTTP "+res.status);
    let data;
    try{ data = await res.json(); }
    catch(e){ throw new Error("La respuesta del backend no es JSON válido (revisá la URL de API_URL)"); }
    if(data && data.error) throw new Error("El backend devolvió un error: "+data.error);
    return data;
  },
  async _post(payload){
    // Content-Type text/plain evita que el navegador dispare un preflight CORS
    // que Apps Script no sabe responder.
    let res;
    try{
      res = await fetch(API_URL, {
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify(payload)
      });
    }catch(e){ throw new Error("No se pudo conectar al backend (red/CORS) al guardar: "+e.message); }
    if(!res.ok) throw new Error("El backend respondió con error HTTP "+res.status+" al guardar");
    let data;
    try{ data = await res.json(); }
    catch(e){ throw new Error("La respuesta del backend no es JSON válido al guardar"); }
    if(data && data.error) throw new Error("El backend devolvió un error al guardar: "+data.error);
    return data;
  },
  async saveClientes(clientes){ return this._post({ action:"saveClientes", clientes }); },
  async saveRelevamiento(almacenId, clienteId, data){ return this._post({ action:"saveRelevamiento", almacenId, clienteId, data }); },
  async uploadPhoto(almacenId, clienteId, slot, dataUrl){ return this._post({ action:"uploadPhoto", almacenId, clienteId, slot, dataUrl }); }
};

/* Carga el stock de agosto (IMPORT_AGOSTO) como si ya hubiera sido relevado con la
   app: crea un almacén "Depósito Principal" por cliente (si no existe) y guarda el
   conteo ya aprobado. Es seguro volver a ejecutarlo: reemplaza el mismo almacén. */
async function importarAgosto(onProgreso){
  const FECHA_IMPORT = "2026-08-01T12:00:00.000Z";
  let huboClientesNuevos = false;
  let hechos = 0, total = 0;
  Object.values(IMPORT_AGOSTO).forEach(cs=>{ total += Object.keys(cs).length; });

  for(const ciudad of Object.keys(IMPORT_AGOSTO)){
    const clientesCiudad = IMPORT_AGOSTO[ciudad];
    for(const nombreCliente of Object.keys(clientesCiudad)){
      const conteos = clientesCiudad[nombreCliente];
      let cliente = STATE.clientes.find(c=>c.ciudad===ciudad && c.nombre.trim().toUpperCase()===nombreCliente.trim().toUpperCase());
      if(!cliente){
        cliente = { id: uid("cli"), ciudad, nombre: nombreCliente, codigo:"", vendedor:"", vendedorTelefono:"", almacenes: [], ventasProm:{} };
        STATE.clientes.push(cliente);
        huboClientesNuevos = true;
      }
      cliente.almacenes = cliente.almacenes || [];
      let almacen = cliente.almacenes.find(a=>a.nombre==="Depósito Principal") || cliente.almacenes[0];
      if(!almacen){
        almacen = { id: uid("alm"), nombre: "Depósito Principal" };
        cliente.almacenes.push(almacen);
        huboClientesNuevos = true;
      }
      const rel = getRelevamiento(almacen.id);
      rel.conteos = conteos;
      rel.fechaCreacion = rel.fechaCreacion || FECHA_IMPORT;
      rel.fechaConteo = FECHA_IMPORT;
      rel.relevadorNombre = "Importado desde Excel (agosto)";
      rel.clienteAcuerdo = true;
      rel.firmaTipo = "nombre";
      rel.firmaNombreTexto = "Importación inicial";
      rel.fechaFirma = FECHA_IMPORT;
      rel.estadoVendedor = "aprobado";
      await DB.saveRelevamiento(almacen.id, cliente.id, rel);
      hechos++;
      if(onProgreso) onProgreso(hechos, total, nombreCliente);
    }
  }
  if(huboClientesNuevos) await DB.saveClientes(STATE.clientes);
  return hechos;
}

function seedClientesFaltantes(){
  let huboNuevos = false;
  CIUDADES.forEach(ciudad=>{
    const existentes = new Set(STATE.clientes.filter(c=>c.ciudad===ciudad).map(c=>c.nombre.toUpperCase()));
    (SEED_CLIENTES[ciudad]||[]).forEach(sc=>{
      if(!existentes.has(sc.nombre.toUpperCase())){
        STATE.clientes.push({ id: uid("cli"), ciudad, nombre: sc.nombre, codigo: sc.codigo||"", vendedor: sc.vendedor||"", vendedorTelefono: sc.telefono||"", almacenes: [], ventasProm:{} });
        huboNuevos = true;
      }
    });
  });
  return huboNuevos;
}

function clientesDeMiCiudad(){
  if(STATE.ciudad === NACIONAL) return STATE.clientes;
  return STATE.clientes.filter(c=>c.ciudad===STATE.ciudad);
}
function getCliente(id){ return STATE.clientes.find(c=>c.id===id); }
function getRelevamiento(almacenId){
  if(!STATE.relevamientos[almacenId]) STATE.relevamientos[almacenId] = emptyRelevamiento(almacenId);
  return STATE.relevamientos[almacenId];
}
function totalUnidades(rel){ return Object.values(rel.conteos||{}).reduce((a,b)=>a+(Number(b)||0),0); }
function clienteEstadoGeneral(cliente){
  const recs = (cliente.almacenes||[]).map(a=>STATE.relevamientos[a.id]).filter(Boolean);
  if(recs.length===0) return "sin_iniciar";
  if(recs.some(r=>r.estadoVendedor==="rechazado")) return "rechazado";
  if(recs.every(r=>r.estadoVendedor==="aprobado")) return "aprobado";
  if(recs.some(r=>r.estadoVendedor==="pendiente")) return "pendiente";
  return "en_progreso";
}
function badgeFor(estado){
  const map = {
    sin_iniciar:["Sin iniciar","badge-done"], en_progreso:["En progreso","badge-progress"],
    pendiente:["Pendiente aprobación","badge-pending"], aprobado:["Aprobado","badge-approved"],
    rechazado:["Rechazado","badge-rejected"],
  };
  return map[estado]||["-","badge-done"];
}

/* stock actual por SKU para un cliente (suma de todos sus almacenes) */
function stockPorSkuCliente(cliente){
  const stock = {};
  (cliente.almacenes||[]).forEach(a=>{
    const rel = STATE.relevamientos[a.id];
    if(!rel) return;
    Object.entries(rel.conteos||{}).forEach(([sku,q])=>{ stock[sku]=(stock[sku]||0)+(Number(q)||0); });
  });
  return stock;
}
/* días de stock = stock actual / (venta promedio mensual / 30) */
function diasStockSku(stockUnidades, ventaMensual){
  if(!ventaMensual || ventaMensual<=0) return null;
  return Math.round((stockUnidades / (ventaMensual/30))*10)/10;
}
function nivelRiesgo(dias){
  if(dias==null) return ["sin dato","badge-done"];
  if(dias < 7) return ["riesgo de quiebre","badge-red"];
  if(dias < 15) return ["stock bajo","badge-amber"];
  return ["cobertura ok","badge-green"];
}

function agruparPorVendedor(lista){
  const grupos = [];
  const indice = {};
  lista.forEach(c=>{
    const key = c.vendedor && c.vendedor.trim() ? c.vendedor.trim() : "Sin vendedor asignado";
    if(indice[key]==null){
      indice[key] = grupos.length;
      grupos.push({ vendedor:key, telefono:c.vendedorTelefono||"", clientes:[] });
    }
    grupos[indice[key]].clientes.push(c);
  });
  return grupos;
}

function almacenListoParaConteo(rel){
  return !!(rel && rel.gps && rel.fotos && rel.fotos.slice(0,2).filter(Boolean).length===2);
}

/* Una vez enviado a aprobación (o ya aprobado/rechazado), el relevador ya no puede
   tocar esos datos. Solo el Administrador puede seguir editando. */
function almacenBloqueado(rel){
  return !!(rel && rel.estadoVendedor && rel.estadoVendedor!=="borrador");
}
function clienteBloqueado(cliente){
  return (cliente.almacenes||[]).some(a=>almacenBloqueado(STATE.relevamientos[a.id]));
}
function esAdministrador(){ return STATE.role==="administrador"; }

function abrirAlmacen(almacenId){
  STATE.almacenId = almacenId;
  const rel = getRelevamiento(almacenId);
  if(almacenBloqueado(rel) && !esAdministrador()){
    STATE.screen = "almacenBloqueado"; render(); return;
  }
  STATE.screen = almacenListoParaConteo(rel) ? "conteo" : "ubicacionFotos";
  render();

function categoriasDesplegables(items, valueKey, dataAttr, relOrCliente){
  return CATEGORIES.map(cat=>{
    const skus = items.filter(s=>s.categoria===cat);
    const conDatos = skus.filter(s=>relOrCliente[valueKey] && relOrCliente[valueKey][s.id]!=null && relOrCliente[valueKey][s.id]!=="").length;
    return `<details class="cat-block" ${conDatos>0?'open':''}>
      <summary><span><span class="arrow">▸</span> ${cat}</span><span class="count">${conDatos}/${skus.length} con datos</span></summary>
      <div class="cat-body">
        ${skus.map(s=>`<div class="sku-row">
          <div class="name"><b>${s.marca}</b><span>${s.formatoMostrado}</span></div>
          <input type="number" min="0" inputmode="numeric" placeholder="0" data-${dataAttr}="${s.id}" value="${(relOrCliente[valueKey]&&relOrCliente[valueKey][s.id]!=null)?relOrCliente[valueKey][s.id]:''}">
        </div>`).join("")}
      </div>
    </details>`;
  }).join("");
}

function linkWhatsApp(telefono, mensaje){
  const limpio = String(telefono||"").replace(/\D/g,"");
  const numero = limpio.length===8 ? "591"+limpio : limpio; // celulares bolivianos: 8 dígitos + código de país 591
  return "https://wa.me/"+numero+"?text="+encodeURIComponent(mensaje);
}

function screenDashboard(){
  const clientes = clientesDeMiCiudad();
  let totalStockCiudad = 0;
  let sumaDias=0, countDias=0;
  const porCategoria = {};
  const porCiudad = {};
  const riesgos = []; // {cliente, sku, dias}
  const clientesCobertura = []; // {cliente, dias}
  const stockPorCliente = []; // {nombre, ciudad, stock}
  let pendientesAprobacion = 0;
  let relevadosEsteMes = 0;
  const hoy = Date.now();

  clientes.forEach(c=>{
    const stock = stockPorSkuCliente(c);
    let stockCliente=0, ventaMensualCliente=0, diasClienteAcc=[];
    Object.entries(stock).forEach(([skuId,qty])=>{
      totalStockCiudad += qty;
      stockCliente += qty;
      porCiudad[c.ciudad] = (porCiudad[c.ciudad]||0)+qty;
      const sku = SKU_CATALOG.find(s=>s.id===skuId);
      if(sku) porCategoria[sku.categoria] = (porCategoria[sku.categoria]||0)+qty;
      const venta = (c.ventasProm||{})[skuId];
      const dias = diasStockSku(qty, venta);
      if(dias!=null){
        sumaDias += dias; countDias++;
        diasClienteAcc.push(dias);
        if(sku) riesgos.push({cliente:c.nombre+(STATE.ciudad===NACIONAL?" ("+c.ciudad+")":""), sku:sku.marca+" "+sku.formatoMostrado, dias});
      }
      if(venta) ventaMensualCliente += Number(venta);
    });
    if(stockCliente>0) stockPorCliente.push({ nombre:c.nombre, ciudad:c.ciudad, stock:stockCliente });
    if(diasClienteAcc.length>0){
      const prom = diasClienteAcc.reduce((a,b)=>a+b,0)/diasClienteAcc.length;
      clientesCobertura.push({cliente:c.nombre+(STATE.ciudad===NACIONAL?" ("+c.ciudad+")":""), dias:Math.round(prom*10)/10});
    }
    (c.almacenes||[]).forEach(a=>{
      const rel = STATE.relevamientos[a.id];
      if(!rel) return;
      if(rel.estadoVendedor==="pendiente") pendientesAprobacion++;
      if(rel.fechaConteo && (hoy-new Date(rel.fechaConteo).getTime())/86400000<=30) relevadosEsteMes++;
    });
  });

  riesgos.sort((a,b)=>a.dias-b.dias);
  clientesCobertura.sort((a,b)=>a.dias-b.dias);
  stockPorCliente.sort((a,b)=>b.stock-a.stock);
  const coberturaPromedio = countDias>0 ? Math.round((sumaDias/countDias)*10)/10 : null;
  const maxCat = Math.max(1,...Object.values(porCategoria));
  const maxCiudad = Math.max(1,...Object.values(porCiudad));

  return `
  ${header("Dashboard comercial",nombreCiudad(STATE.ciudad)+" · datos para el equipo de ventas",false)}
  <main>
    <div class="card">
      <div class="metric"><span class="lbl">Total unidades en stock</span><span class="val">${totalStockCiudad}</span></div>
      <div class="metric"><span class="lbl">Cobertura promedio de stock</span><span class="val">${coberturaPromedio!=null? coberturaPromedio+" días":"sin datos de venta"}</span></div>
      <div class="metric"><span class="lbl">Almacenes relevados en los últimos 30 días</span><span class="val">${relevadosEsteMes}</span></div>
      <div class="metric"><span class="lbl">Pendientes de aprobación</span><span class="val">${pendientesAprobacion}</span></div>
    </div>

    ${(()=>{
      const hist = historicoParaCiudad(STATE.ciudad);
      if(!hist) return "";
      const max = Math.max(...hist,1);
      const esCombinado = ["ORURO","POTOSI","SUCRE","TARIJA"].includes(STATE.ciudad);
      return `
    <h2 class="section-title">Evolución del stock (mayo–agosto, planilla Trade Stock)</h2>
    <div class="card">
      ${esCombinado?`<div class="hint" style="margin-bottom:8px;">Dato histórico combinado de Oruro + Potosí + Sucre + Tarija: la planilla original no separaba estas 4 ciudades mes a mes.</div>`:""}
      ${HISTORICO_MENSUAL.meses.map((m,i)=>`
        <div class="bar-row">
          <div class="top"><span>${m}${i===HISTORICO_MENSUAL.meses.length-1?" (agosto)":""}</span><span>${hist[i]} u.</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(hist[i]/max*100).toFixed(0)}%"></div></div>
        </div>`).join("")}
      <div class="hint" style="margin-top:6px;">Estos totales vienen de la planilla Trade Stock de referencia. El "Total unidades en stock" de arriba es el dato en vivo cargado en la app.</div>
    </div>`;
    })()}

    ${STATE.ciudad===NACIONAL ? `
    <h2 class="section-title">Stock por ciudad</h2>
    <div class="card">
      ${Object.keys(porCiudad).length===0?`<div class="hint">Todavía no hay conteos cargados.</div>`:
      CIUDADES.filter(c=>porCiudad[c]).map(c=>`
        <div class="bar-row">
          <div class="top"><span>${c}</span><span>${porCiudad[c]} u.</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(porCiudad[c]/maxCiudad*100).toFixed(0)}%"></div></div>
        </div>`).join("")}
    </div>` : ``}

    <h2 class="section-title">Stock por categoría</h2>
    <div class="card">
      ${Object.keys(porCategoria).length===0?`<div class="hint">Todavía no hay conteos cargados.</div>`:
      Object.entries(porCategoria).sort((a,b)=>b[1]-a[1]).map(([cat,qty])=>`
        <div class="bar-row">
          <div class="top"><span>${cat}</span><span>${qty} u.</span></div>
          <div class="bar-track"><div class="bar-fill" style="width:${(qty/maxCat*100).toFixed(0)}%"></div></div>
        </div>`).join("")}
    </div>

    <h2 class="section-title">Clientes con más stock ${STATE.ciudad===NACIONAL?"(participación sobre su propia ciudad)":"(participación sobre "+STATE.ciudad+")"}</h2>
    <div class="card">
      ${stockPorCliente.length===0?`<div class="hint">Todavía no hay conteos cargados.</div>`:
      stockPorCliente.slice(0,8).map((r,i)=>{
        const base = STATE.ciudad===NACIONAL ? (porCiudad[r.ciudad]||1) : totalStockCiudad;
        const pct = base>0 ? Math.round((r.stock/base)*1000)/10 : 0;
        return `<div class="risk-item">
          <div><div class="name">${i+1}. ${r.nombre}${STATE.ciudad===NACIONAL?` <span class="sub">(${r.ciudad})</span>`:""}</div><div class="sub">${r.stock} unidades</div></div>
          <span class="badge badge-approved">${pct}%</span>
        </div>`;
      }).join("")}
    </div>

    <h2 class="section-title">Clientes con menor cobertura (riesgo de quiebre)</h2>
    <div class="card">
      ${clientesCobertura.length===0?`<div class="hint">Cargá la venta promedio mensual de cada cliente (desde Aprobaciones → cliente → "Cargar venta promedio mensual") para ver esta alerta.</div>`:
      clientesCobertura.slice(0,6).map(r=>{
        const [lbl,cls]=nivelRiesgo(r.dias);
        return `<div class="risk-item"><div><div class="name">${r.cliente}</div><div class="sub">cobertura promedio</div></div><span class="badge ${cls}">${r.dias} días</span></div>`;
      }).join("")}
    </div>

    <h2 class="section-title">Productos en riesgo de quiebre por cliente</h2>
    <div class="card">
      ${riesgos.length===0?`<div class="hint">Sin datos suficientes todavía.</div>`:
      riesgos.slice(0,8).map(r=>{
        const [lbl,cls]=nivelRiesgo(r.dias);
        return `<div class="risk-item"><div><div class="name">${r.sku}</div><div class="sub">${r.cliente}</div></div><span class="badge ${cls}">${r.dias} días</span></div>`;
      }).join("")}
    </div>
  </main>
  ${tabbar('dashboard')}`;
}

--------------------------------------------------------------- */
function bindEvents(){
  $app.querySelectorAll("[data-nav]").forEach(el=>{
    el.addEventListener("click",()=>{
      if(el.dataset.nav==="login"){ STATE = {...STATE, screen:"login", ciudad:null, role:null, clienteId:null, almacenId:null, loginCiudadElegida:null}; }

  $app.querySelectorAll("[data-vcliente]").forEach(el=>{
    el.addEventListener("click",()=>{ STATE.clienteId = el.dataset.vcliente; STATE.screen="vendedorDetalle"; render(); });
  });
  $app.querySelectorAll("[data-almacen]").forEach(el=>{
    el.addEventListener("click",()=>{ abrirAlmacen(el.dataset.almacen); });
  });
  $app.querySelectorAll("[data-almacen-r]").forEach(el=>{
    el.addEventListener("click",()=>{ abrirAlmacen(el.dataset.almacenR); });
  });

  const btnGuardarCliente = document.getElementById("guardarCliente");
  if(btnGuardarCliente){
    btnGuardarCliente.addEventListener("click", async ()=>{
      const nombre = document.getElementById("cNombre").value.trim();
      const codigo = document.getElementById("cCodigo").value.trim();
      const vendedor = document.getElementById("cVendedor").value.trim();
      const vendedorTelefono = document.getElementById("cVendedorTelefono").value.replace(/\D/g,"");
      const cCiudadEl = document.getElementById("cCiudad");
      const ciudadNuevo = cCiudadEl ? cCiudadEl.value : STATE.ciudad;
      if(!nombre){ showToast("Ingresá el nombre del cliente"); return; }
      const nuevo = { id: uid("cli"), ciudad: ciudadNuevo, nombre, codigo, vendedor, vendedorTelefono, almacenes: [], ventasProm:{} };
      STATE.clientes.push(nuevo);
      await saveClientes();
      STATE.clienteId = nuevo.id;
      STATE.screen = "almacenes";
      render();
    });
  }

  const addAlmacenBtn = document.getElementById("addAlmacen");
  if(addAlmacenBtn){
    addAlmacenBtn.addEventListener("click", async ()=>{
      const input = document.getElementById("nuevoAlmacen");
      const nombre = input.value.trim();
      if(!nombre){ showToast("Escribí un nombre para el almacén"); return; }
      const c = getCliente(STATE.clienteId);
      c.almacenes = c.almacenes||[];
      c.almacenes.push({ id: uid("alm"), nombre });
      await saveClientes();
      input.value="";
      render();
    });
  }

  async function guardarConteoDesdeInputs(){
    const rel = getRelevamiento(STATE.almacenId);
    $app.querySelectorAll("[data-sku]").forEach(inp=>{
      const v = inp.value;
      if(v!=="" && Number(v)>=0) rel.conteos[inp.dataset.sku] = Number(v);
      else delete rel.conteos[inp.dataset.sku];
    });
    rel.fechaConteo = new Date().toISOString();
    rel.relevadorNombre = STATE.userName;
    await saveRelevamientoActual(STATE.almacenId);
  }
  const guardarConteoBtn = document.getElementById("guardarConteo");
  if(guardarConteoBtn){
    guardarConteoBtn.addEventListener("click", async ()=>{
      await guardarConteoDesdeInputs();
      showToast("Conteo guardado");
      STATE.screen="almacenes"; render();
    });
  }
  const irFotosBtn = document.getElementById("continuarConteoBtn");
  if(irFotosBtn){
    irFotosBtn.addEventListener("click", ()=>{
      const rel = getRelevamiento(STATE.almacenId);
      if(!almacenListoParaConteo(rel)){ showToast("Completá la ubicación y las 4 fotos primero"); return; }
      STATE.screen="conteo"; render();
    });
  }
  const volverFotosBtn = document.getElementById("volverFotosBtn");
  if(volverFotosBtn){
    volverFotosBtn.addEventListener("click", ()=>{ STATE.screen="ubicacionFotos"; render(); });
  }

  const guardarVentasBtn = document.getElementById("guardarVentas");
  if(guardarVentasBtn){
    guardarVentasBtn.addEventListener("click", async ()=>{
      const c = getCliente(STATE.clienteId);
      c.ventasProm = c.ventasProm || {};
      $app.querySelectorAll("[data-venta]").forEach(inp=>{
        const v = inp.value;
        if(v!=="" && Number(v)>=0) c.ventasProm[inp.dataset.venta] = Number(v);
        else delete c.ventasProm[inp.dataset.venta];

      await saveClientes();
      showToast("Venta promedio guardada");
      STATE.screen="vendedorDetalle"; render();
    });
  }

  const gpsBtn = document.getElementById("capturarGps");
  if(gpsBtn){
    gpsBtn.addEventListener("click", ()=>{
      if(!navigator.geolocation){ showToast("Este navegador no soporta GPS"); return; }
      gpsBtn.textContent = "Buscando señal…";
      navigator.geolocation.getCurrentPosition(async (pos)=>{
        const rel = getRelevamiento(STATE.almacenId);
        rel.gps = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy, ts: Date.now() };
        await saveRelevamientoActual(STATE.almacenId);
        render();
      }, (err)=>{ showToast("No se pudo obtener la ubicación: "+err.message); render(); }, { enableHighAccuracy:true, timeout:15000 });
    });

  $app.querySelectorAll("[data-foto]").forEach(inp=>{
    inp.addEventListener("change", (e)=>{

      const almacenId = STATE.almacenId;
      handleFile(e.target.files[0], async (dataUrl)=>{
        showToast("Subiendo foto…");
        const res = await DB.uploadPhoto(almacenId, STATE.clienteId, String(idx), dataUrl);
        const rel = getRelevamiento(almacenId);
        rel.fotos[idx] = (res && res.url) || dataUrl;
        rel.fotosEliminadas = false;
        await saveRelevamientoActual(almacenId);
        showToast("Foto guardada");
        render();
      });
    });
  });

  const acuerdoCheck = document.getElementById("acuerdoCheck");
  if(acuerdoCheck){
    acuerdoCheck.addEventListener("change",()=>{
      STATE.firmaAcuerdo = acuerdoCheck.checked;
      if(!STATE.firmaAcuerdo){ STATE.firmaMetodo="dibujo"; STATE.firmaNombreTexto=""; }
      render();
    });
  }

  const metodoDibujoBtn = document.getElementById("metodoDibujo");
  if(metodoDibujoBtn){ metodoDibujoBtn.addEventListener("click", ()=>{ STATE.firmaMetodo="dibujo"; render(); }); }
  const metodoNombreBtn = document.getElementById("metodoNombre");
  if(metodoNombreBtn){ metodoNombreBtn.addEventListener("click", ()=>{ STATE.firmaMetodo="nombre"; render(); }); }
  const firmaNombreInput = document.getElementById("firmaNombreInput");
  if(firmaNombreInput){ firmaNombreInput.addEventListener("input", ()=>{ STATE.firmaNombreTexto = firmaNombreInput.value; }); }

  const limpiarFirma = document.getElementById("limpiarFirma");
  if(limpiarFirma){ limpiarFirma.addEventListener("click",()=>{ clearSignature(); }); }

  async function finalizarEnvioFirma(){
    showToast("Enviando…");
    const c = getCliente(STATE.clienteId);
    const almacenes = c.almacenes||[];
    const primero = almacenes[0];
    const firmaImgLocal = STATE.firmaMetodo==="dibujo" ? getSignatureDataUrl() : generarImagenNombre(STATE.firmaNombreTexto);
    const resFirma = await DB.uploadPhoto(primero.id, c.id, "firma", firmaImgLocal);
    const firmaImgUrl = (resFirma && resFirma.url) || firmaImgLocal;
    for(const a of almacenes){
      const rel = getRelevamiento(a.id);
      rel.clienteAcuerdo = true;
      rel.firmaImg = firmaImgUrl;
      rel.firmaTipo = STATE.firmaMetodo;
      rel.firmaNombreTexto = STATE.firmaMetodo==="nombre" ? STATE.firmaNombreTexto : "";
      rel.fotosEliminadas = false;
      rel.fechaFirma = new Date().toISOString();
      rel.estadoVendedor = "pendiente";
      await saveRelevamientoActual(a.id);
    }
    STATE.firmaAcuerdo=false; STATE.firmaMetodo="dibujo"; STATE.firmaNombreTexto="";
    STATE.ultimoEnvio = { clienteNombre: c.nombre, vendedor: c.vendedor||"", vendedorTelefono: c.vendedorTelefono||"" };
    STATE.screen="envioExitoso"; render();
  }

  const enviarVendedorBtn = document.getElementById("enviarVendedor");

  $app.querySelectorAll("[data-aprobar]").forEach(el=>{
    el.addEventListener("click", async ()=>{

      await saveRelevamientoActual(el.dataset.aprobar);

  const exportarBtn = document.getElementById("exportarBtn");
  if(exportarBtn){ exportarBtn.addEventListener("click", exportarExcel); }

/* ---------------------------------------------------------------
   FOTO: redimensiona y comprime
--------------------------------------------------------------- */
function handleFile(file, cb){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 900;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL("image/jpeg",0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------------------------------------------------------------
   FIRMA (canvas)
--------------------------------------------------------------- */
let sigCtx=null, sigDrawing=false, sigHas=false;
function setupSignaturePad(){
  const canvas = document.getElementById("sigPad");
  if(!canvas) return;
  const ratio = window.devicePixelRatio||1;
  canvas.width = canvas.clientWidth*ratio;
  canvas.height = canvas.clientHeight*ratio;
  sigCtx = canvas.getContext("2d");
  sigCtx.scale(ratio,ratio);
  sigCtx.lineWidth=2.4; sigCtx.lineCap="round"; sigCtx.strokeStyle="#1c2b24";
  sigHas=false;
  function pos(e){ const r = canvas.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return {x:t.clientX-r.left, y:t.clientY-r.top}; }
  function start(e){ sigDrawing=true; sigHas=true; const p=pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!sigDrawing) return; const p=pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); e.preventDefault(); }
  function end(){ sigDrawing=false; }
  canvas.addEventListener("mousedown",start); canvas.addEventListener("mousemove",move); window.addEventListener("mouseup",end);
  canvas.addEventListener("touchstart",start,{passive:false}); canvas.addEventListener("touchmove",move,{passive:false}); canvas.addEventListener("touchend",end);
}
function clearSignature(){ const canvas = document.getElementById("sigPad"); if(!canvas||!sigCtx) return; sigCtx.clearRect(0,0,canvas.width,canvas.height); sigHas=false; }
function hasSignature(){ return sigHas; }
function getSignatureDataUrl(){ return document.getElementById("sigPad").toDataURL("image/png"); }

function generarImagenNombre(nombre){
  const canvas = document.createElement("canvas");
  canvas.width = 600; canvas.height = 200;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fdfcf9"; ctx.fillRect(0,0,600,200);
  ctx.strokeStyle = "#d8d2c2"; ctx.lineWidth=2; ctx.strokeRect(1,1,598,198);
  ctx.fillStyle = "#1c2b24";
  ctx.font = "italic 40px Georgia, 'Times New Roman', serif";
  ctx.textBaseline = "middle";
  ctx.fillText(nombre || "", 24, 95, 552);
  ctx.font = "12px sans-serif"; ctx.fillStyle = "#8a9188";
  ctx.fillText("Confirmado escribiendo el nombre — " + new Date().toLocaleString(), 24, 160, 552);
  return canvas.toDataURL("image/png");
}

function mesActualAbrev(){
  const meses = ["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
  return meses[new Date().getMonth()];
}

/* Genera la hoja de una ciudad con el mismo layout que la planilla base:
   fila1 = VENDEDOR (por columna de cliente), fila2 = código de cliente,
   fila3 = encabezados de producto + nombre de cliente, filas siguientes = catálogo. */
function buildCitySheetRows(clientesCiudad){
  const porVendedor = {};
  clientesCiudad.forEach(c=>{
    const v = c.vendedor || "Sin vendedor";
    porVendedor[v] = porVendedor[v]||[];
    porVendedor[v].push(c);
  });

  const filaVendedor = ["","","","","","VENDEDOR"];
  const filaCodigo = ["codigo de cliente","","","","","",];
  const filaHeader = ["N°","Marca","Categoría","Formato","Observaciones","LINEA 3"];
  const colClientes = [];
  Object.entries(porVendedor).forEach(([vendedor, clientes])=>{
    clientes.forEach(c=>{
      filaVendedor.push(vendedor);
      filaCodigo.push(c.codigo || "");
      filaHeader.push(c.nombre);
      colClientes.push(c);
    });
  });
  filaVendedor.push("");
  filaCodigo.push("");
  filaHeader.push("TOTAL STOCK "+mesActualAbrev());

  const rows = [filaVendedor, filaCodigo, filaHeader];
  let ultimaMarca = null;
  SKU_CATALOG.forEach(s=>{
    const marcaCelda = s.marcaShown ? s.marca : "";
    const linea3 = (s.categoria+" "+s.formato).trim();
    const row = [s.n, marcaCelda, s.categoria, s.formato, s.observaciones, linea3];
    let totalFila = 0;
    colClientes.forEach(c=>{
      const stock = stockPorSkuCliente(c);
      const val = stock[s.id] || 0;
      totalFila += val;
      row.push(val || "");
    });
    row.push(totalFila || "");
    rows.push(row);
  });
  return rows;
}

function exportarExcel(){
  const wb = XLSX.utils.book_new();
  const esNacional = STATE.ciudad===NACIONAL;
  const ciudadesAExportar = esNacional ? CIUDADES : [STATE.ciudad];
  const clientesAExportar = esNacional ? STATE.clientes : STATE.clientes.filter(c=>c.ciudad===STATE.ciudad);

  ciudadesAExportar.forEach(ciudad=>{
    const clientesCiudad = STATE.clientes.filter(c=>c.ciudad===ciudad);
    if(clientesCiudad.length===0) return;
    const rows = buildCitySheetRows(clientesCiudad);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), ciudad);
  });

  const detalle = [["Ciudad","Cliente","Vendedor","Almacén","Fecha conteo","Relevador","Latitud","Longitud","Precisión (m)","Fotos vigentes","Fotos eliminadas por vencimiento","Cliente conforme","Tipo de firma","Firma registrada","Estado vendedor"]];
  clientesAExportar.forEach(c=>{
    (c.almacenes||[]).forEach(a=>{
      const r = STATE.relevamientos[a.id] || {};
      detalle.push([
        c.ciudad, c.nombre, c.vendedor||"", a.nombre,
        r.fechaConteo? new Date(r.fechaConteo).toLocaleString():"",
        r.relevadorNombre||"",
        r.gps? r.gps.lat:"", r.gps? r.gps.lng:"", r.gps? Math.round(r.gps.acc):"",
        r.fotos? r.fotos.filter(Boolean).length:0,
        r.fotosEliminadas? "Sí":"No",
        r.clienteAcuerdo===true?"Sí":r.clienteAcuerdo===false?"No":"",
        r.firmaTipo==="nombre"?"Nombre escrito":r.firmaTipo==="dibujo"?"Firma en pantalla":"",
        r.firmaImg?"Sí":"No",
        r.estadoVendedor||"borrador",
      ]);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(detalle), "Detalle");

  const dash = [["Ciudad","Cliente","Vendedor","Stock total (u.)","Venta prom. mensual (u.)","Días de stock promedio","Nivel"]];
  clientesAExportar.forEach(c=>{
    const stock = stockPorSkuCliente(c);
    const stockTotal = Object.values(stock).reduce((a,b)=>a+b,0);
    const ventas = c.ventasProm||{};
    const ventaTotal = Object.values(ventas).reduce((a,b)=>a+(Number(b)||0),0);
    const diasArr = Object.entries(stock).map(([sku,q])=>diasStockSku(q, ventas[sku])).filter(d=>d!=null);
    const diasProm = diasArr.length? Math.round((diasArr.reduce((a,b)=>a+b,0)/diasArr.length)*10)/10 : "";
    const [nivel] = diasProm!==""? nivelRiesgo(diasProm) : ["sin dato"];
    dash.push([c.ciudad, c.nombre, c.vendedor||"", stockTotal, ventaTotal||"", diasProm, nivel]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dash), "Dashboard");

  const nombreArchivo = "Relevamiento_"+(esNacional?"TODAS_LAS_CIUDADES":STATE.ciudad)+"_"+new Date().toISOString().slice(0,10)+".xlsx";
  XLSX.writeFile(wb, nombreArchivo);
}
