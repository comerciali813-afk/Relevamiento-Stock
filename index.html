<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Relevamiento de Stock</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ink:#1c2b24;
  --paper:#f6f4ee;
  --line:#d8d2c2;
  --brand:#2f5d4f;
  --brand-dark:#1f4136;
  --brand-soft:#e4ede9;
  --amber:#c98a2c;
  --amber-soft:#f6e9d3;
  --red:#a63a3a;
  --red-soft:#f5e3e0;
  --green:#2f7d4f;
  --radius:10px;
  font-size:16px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--paper);color:var(--ink);-webkit-tap-highlight-color:transparent;}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#fff;box-shadow:0 0 40px rgba(0,0,0,.06);}
header.top{background:var(--brand-dark);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;}
header.top .mark{width:30px;height:30px;border-radius:7px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--brand-dark);font-size:15px;flex:none;}
header.top .titles{flex:1;min-width:0;}
header.top h1{font-size:15px;margin:0;font-weight:700;letter-spacing:.2px;}
header.top .sub{font-size:11.5px;opacity:.75;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
header.top button.back{background:none;border:none;color:#fff;font-size:20px;padding:4px 6px;cursor:pointer;line-height:1;}
main{flex:1;padding:18px 18px 90px;}
h2.section-title{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--brand);margin:0 0 12px;font-weight:700;}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;color:#5b6660;margin-bottom:5px;font-weight:600;}
input[type=text],input[type=number],input[type=search],input[type=password],select,textarea{
  width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:15px;background:#fdfcf9;color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:var(--brand);}
button.btn{border:none;border-radius:8px;padding:12px 16px;font-size:14.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;letter-spacing:.01em;}
button.btn:disabled{opacity:.45;cursor:not-allowed;}
.btn-primary{background:var(--brand);color:#fff;}
.btn-primary:active{background:var(--brand-dark);}
.btn-outline{background:#fff;color:var(--brand);border:1.5px solid var(--brand);}
.btn-ghost{background:var(--brand-soft);color:var(--brand-dark);}
.btn-danger{background:var(--red-soft);color:var(--red);}
.btn-amber{background:var(--amber);color:#3a2500;}
.row-btns{display:flex;gap:10px;margin-top:14px;}
.list-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fdfcf9;cursor:pointer;}
.vendor-group{margin-bottom:18px;}
.vendor-heading{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 8px;border-bottom:1.5px solid var(--brand);margin-bottom:10px;}
.vendor-heading span:first-child{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--brand-dark);}
.vendor-phone{font-size:11.5px;color:#6b756f;font-weight:600;}
.list-item:active{background:var(--brand-soft);}
.list-item .meta{font-size:12px;color:#6b756f;margin-top:2px;}
.chev{color:#9aa39c;font-size:18px;}
.badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:100px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;}
.badge-progress{background:var(--amber-soft);color:#8a5a10;}
.badge-pending{background:var(--amber-soft);color:#8a5a10;}
.badge-approved{background:var(--brand-soft);color:var(--brand-dark);}
.badge-rejected{background:var(--red-soft);color:var(--red);}
.badge-done{background:#e6e6e6;color:#444;}
.badge-red{background:var(--red-soft);color:var(--red);}
.badge-amber{background:var(--amber-soft);color:#8a5a10;}
.badge-green{background:var(--brand-soft);color:var(--green);}
.empty{text-align:center;padding:40px 10px;color:#8a9188;}
.empty .big{font-size:34px;margin-bottom:8px;}
details.cat-block{margin-bottom:10px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fdfcf9;}
details.cat-block summary{list-style:none;cursor:pointer;padding:11px 14px;font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--brand-dark);font-weight:700;display:flex;justify-content:space-between;align-items:center;background:var(--brand-soft);}
details.cat-block summary::-webkit-details-marker{display:none;}
details.cat-block summary .arrow{transition:transform .15s;font-size:11px;color:var(--brand);}
details.cat-block[open] summary .arrow{transform:rotate(90deg);}
details.cat-block summary .count{font-weight:600;text-transform:none;letter-spacing:0;font-size:11px;color:var(--brand);}
details.cat-block-l3{margin:8px 0 8px 10px;border-color:#e6e0d5;}
details.cat-block-l3 summary{background:#f6f2e8;color:#7a5310;font-size:11.5px;padding:9px 12px;}
details.cat-block-l3 summary .arrow{color:#c98a2c;}
details.cat-block-l3 summary .count{color:#c98a2c;}
.cat-body{padding:4px 14px 6px;}
.sku-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);}
.sku-row:last-child{border-bottom:none;}
.sku-row .name{flex:1;font-size:13.5px;line-height:1.3;}
.sku-row .name b{display:block;font-size:13px;}
.sku-row .name span{color:#8a9188;font-size:12px;}
.sku-row input{width:74px;text-align:center;padding:9px 4px;}
.gps-box{display:flex;align-items:center;gap:10px;padding:12px;border:1px dashed var(--line);border-radius:8px;background:#fbfaf6;}
.gps-box .ok{color:var(--brand);font-weight:700;}
.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.photo-slot{aspect-ratio:1/1;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;background:#fbfaf6;font-size:11px;color:#8a9188;text-align:center;padding:4px;}
.photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.photo-slot input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.photo-slot .lbl{pointer-events:none;}
.photo-slot.filled .lbl{display:none;}
.sig-pad{border:1.5px dashed var(--line);border-radius:8px;background:#fdfcf9;touch-action:none;width:100%;height:180px;display:block;}
.hint{font-size:12px;color:#8a9188;margin-top:6px;line-height:1.4;}
.total-pill{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--brand-soft);border-radius:8px;font-size:13.5px;font-weight:700;color:var(--brand-dark);margin-bottom:10px;}
.tabbar{position:sticky;bottom:0;display:flex;border-top:1px solid var(--line);background:#fff;z-index:20;}
.tabbar button{flex:1;background:none;border:none;padding:11px 4px 9px;font-size:11px;color:#8a9188;font-weight:600;cursor:pointer;}
.tabbar button.active{color:var(--brand);}
.tabbar .ic{display:block;font-size:18px;margin-bottom:2px;}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--brand-dark);color:#fff;padding:10px 18px;border-radius:100px;font-size:13px;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90%;text-align:center;}
.mini-note{background:var(--amber-soft);border:1px solid #e6cf9e;border-radius:8px;padding:10px 12px;font-size:12px;color:#7a5310;margin-bottom:14px;line-height:1.5;}
.check-row{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fdfcf9;margin-bottom:12px;}
.check-row input{width:20px;height:20px;margin-top:1px;flex:none;}
.check-row label{font-size:13.5px;line-height:1.4;}
.foot-actions{display:flex;gap:10px;margin-top:16px;}
.city-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.city-btn{border:1.5px solid var(--line);background:#fdfcf9;border-radius:10px;padding:20px 8px;text-align:center;font-weight:700;font-size:15px;color:var(--brand-dark);cursor:pointer;}
.city-btn.active{border-color:var(--brand);background:var(--brand-soft);}
.metric{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px dashed var(--line);}
.metric:last-child{border-bottom:none;}
.metric .lbl{font-size:12.5px;color:#5b6660;}
.metric .val{font-size:16px;font-weight:700;color:var(--brand-dark);}
.bar-row{margin-bottom:10px;}
.bar-row .top{display:flex;justify-content:space-between;font-size:12px;color:#556;margin-bottom:4px;}
.bar-track{height:8px;border-radius:5px;background:var(--brand-soft);overflow:hidden;}
.bar-fill{height:100%;background:var(--brand);border-radius:5px;}
.bar-fill.c0{background:#2f5d4f;} .bar-fill.c1{background:#c98a2c;} .bar-fill.c2{background:#3a6ea5;}
.bar-fill.c3{background:#a63a3a;} .bar-fill.c4{background:#7a5cad;} .bar-fill.c5{background:#2b8a8a;}
.bar-fill.c6{background:#c25b8f;}
.dash-month{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);color:#fff;padding:4px 12px;border-radius:100px;font-size:12px;font-weight:700;margin-top:4px;}
.city-filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.city-filter-chip{padding:7px 14px;border-radius:100px;border:1.5px solid var(--line);background:#fdfcf9;font-size:12.5px;font-weight:700;color:#556;cursor:pointer;}
.city-filter-chip.active{background:var(--brand);border-color:var(--brand);color:#fff;}
.risk-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.risk-item:last-child{border-bottom:none;}
.risk-item .name{font-weight:600;}
.risk-item .sub{font-size:11.5px;color:#8a9188;}

/* --- Dashboard estilo "pro" (header oscuro, tarjetas de metricas, dona) --- */
.dash2-header{background:#152a4a;color:#fff;padding:16px 18px;}
.dash2-header .t{font-size:16px;font-weight:700;}
.dash2-header .s{font-size:11.5px;opacity:.7;margin-top:1px;}
.dash2-filters{display:flex;gap:6px;margin:14px 18px 4px;flex-wrap:wrap;}
.dash2-filters select{flex:1;min-width:90px;background:#fff;border:1px solid #e2e6ec;border-radius:9px;padding:7px 8px;font-size:11px;font-weight:700;color:#152a4a;}
.dash2-metrics{display:flex;gap:8px;margin:14px 18px;}
.dash2-metric{flex:1;background:#fff;border-radius:12px;padding:11px;min-width:0;}
.dash2-metric .ic{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;font-size:14px;}
.dash2-metric .lbl{font-size:9px;color:#8a94a3;line-height:1.2;}
.dash2-metric .val{font-size:16px;font-weight:700;color:#152a4a;margin-top:1px;}
.dash2-metric .trend{font-size:9px;margin-top:2px;}
.dash2-card{background:#fff;border-radius:14px;padding:13px 14px;margin:0 18px 14px;}
.dash2-card .title{font-size:12.5px;font-weight:700;color:#152a4a;margin-bottom:10px;}
.dias-badge{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:100px;white-space:nowrap;}
.dias-badge.red{background:#ffe0e0;color:#a31f1f;}
.dias-badge.amber{background:#fff1cf;color:#a3730a;}
.dias-badge.green{background:#e5f6ef;color:#0e8f6f;}
.dias-badge.gray{background:#eef1f5;color:#8a94a3;}
.linea2-row{padding:12px 14px;border-radius:10px;background:#f7f9fb;display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:8px;}
.linea2-row.open{background:#eaf0fd;}
.linea3-sub{padding:8px 6px 4px 16px;}
.linea3-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #eef1f5;}
.linea3-item:last-child{border-bottom:none;}
.city-mini{flex:1;border-radius:9px;padding:8px 6px;text-align:center;}
.city-mini .lbl{font-size:9px;font-weight:700;}
.city-mini .val{font-size:15px;font-weight:700;color:#152a4a;}
</style>
</head>

}

  const ciudadesASumar = ciudad===NACIONAL ? ["CBBA","LPZ","SCZ","SUR"] : [claveCiudad];
  const porLinea = {};
  ciudadesASumar.forEach(cv=>{
    const datos = HIST_SKU_MENSUAL[cv];
    if(!datos) return;
    Object.entries(datos).forEach(([n, meses])=>{
      const val = meses[mes];
      if(!val) return;
      const linea = SKU_A_LINEA["sku_"+n];
      if(!linea) return;
      porLinea[linea] = (porLinea[linea]||0) + val;
    });
  });
  return porLinea;
}

function stockPorLineaCliente(cliente){
  const stock = {};
  (cliente.almacenes||[]).forEach(a=>{
    const rel = STATE.relevamientos[a.id];
    if(!rel) return;
    Object.entries(rel.conteos||{}).forEach(([skuId,qty])=>{
      const linea = SKU_A_LINEA[skuId];
      if(!linea) return;
      stock[linea] = (stock[linea]||0) + (Number(qty)||0);
    });
  });
  return stock;
}

const API_URL = "https://script.google.com/macros/s/AKfycbz0HsK830YKvNgWb777qRcZjdyekMLNp78s9tu8aS7R0XvnIeRE13QbiGERMwpQxwjo/exec";
const USE_BACKEND = API_URL.trim().length > 0;

/* ---------------------------------------------------------------
   PERSISTENCIA
   - Dentro del chat de Claude: usa window.storage (memoria compartida del artefacto).
   - Alojado afuera (GitHub Pages, etc.) sin backend todavía configurado: usa
     localStorage del navegador, así los datos no se pierden al recargar la página
     mientras hacés pruebas.
   - Con API_URL configurado: usa el backend real (Google Sheets), ver DB_REMOTE.
--------------------------------------------------------------- */
const LS_PREFIX = "relevamiento_stock_";
function tieneStorageClaude(){
  try{ return typeof window!=="undefined" && !!window.storage && typeof window.storage.get==="function"; }
  catch(e){ return false; }
}
function tieneLocalStorage(){
  try{ return typeof window!=="undefined" && !!window.localStorage; }
  catch(e){ return false; }
}

const DB_LOCAL = {
  async _get(key, fallback){
    if(tieneStorageClaude()){
      try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : fallback; }
      catch(e){ /* si falla, seguimos probando otras opciones abajo */ }
    }
    if(tieneLocalStorage()){
      try{ const raw = window.localStorage.getItem(LS_PREFIX+key); return raw!=null ? JSON.parse(raw) : fallback; }
      catch(e){ return fallback; }
    }
    return fallback;
  },
  async _set(key, value){
    if(tieneStorageClaude()){
      try{ await window.storage.set(key, JSON.stringify(value), true); return; }
      catch(e){ /* si falla, seguimos probando otras opciones abajo */ }
    }
    if(tieneLocalStorage()){
      try{ window.localStorage.setItem(LS_PREFIX+key, JSON.stringify(value)); }catch(e){}
    }
  },
  async getAll(){
    const clientes = await this._get("clientes", []);
    const relevamientos = await this._get("relevamientos", {});
    return { clientes, relevamientos };
  },
  async saveClientes(clientes){ await this._set("clientes", clientes); },
  async saveRelevamiento(almacenId, clienteId, data){
    const rel = await this._get("relevamientos", {});
    rel[almacenId] = data;
    await this._set("relevamientos", rel);
  },
  async uploadPhoto(almacenId, clienteId, slot, dataUrl){
    // En modo prueba no hay Drive: la foto se guarda tal cual (base64) en el registro.
    return { ok:true, url: dataUrl };
  },
  async getVentas(){
    // En modo prueba no hay hoja de Ventas real: no hay datos de venta hasta conectar el backend.
    return { ventas: {} };
  }
};

const DB_REMOTE = {
  async getAll(){
    let res;
    try{ res = await fetch(API_URL + "?action=getAll"); }
    catch(e){ throw new Error("No se pudo conectar al backend (red/CORS): "+e.message); }
    if(!res.ok) throw new Error("El backend respondió con error HTTP "+res.status);
    let data;
    try{ data = await res.json(); }
    catch(e){ throw new Error("La respuesta del backend no es JSON válido (revisá la URL de API_URL)"); }
    if(data && data.error) throw new Error("El backend devolvió un error: "+data.error);
    return data;
  },
  async _post(payload){
    // Content-Type text/plain evita que el navegador dispare un preflight CORS
    // que Apps Script no sabe responder.
    let res;
    try{
      res = await fetch(API_URL, {
        method:"POST",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body: JSON.stringify(payload)
      });
    }catch(e){ throw new Error("No se pudo conectar al backend (red/CORS) al guardar: "+e.message); }
    if(!res.ok) throw new Error("El backend respondió con error HTTP "+res.status+" al guardar");
    let data;
    try{ data = await res.json(); }
    catch(e){ throw new Error("La respuesta del backend no es JSON válido al guardar"); }
    if(data && data.error) throw new Error("El backend devolvió un error al guardar: "+data.error);
    return data;
  },
  async saveClientes(clientes){ return this._post({ action:"saveClientes", clientes }); },
  async saveRelevamiento(almacenId, clienteId, data){ return this._post({ action:"saveRelevamiento", almacenId, clienteId, data }); },
  async uploadPhoto(almacenId, clienteId, slot, dataUrl){ return this._post({ action:"uploadPhoto", almacenId, clienteId, slot, dataUrl }); },
  async getVentas(){
    let res;
    try{ res = await fetch(API_URL + "?action=getVentas"); }
    catch(e){ throw new Error("No se pudo conectar al backend (red/CORS) al pedir ventas: "+e.message); }
    if(!res.ok) throw new Error("El backend respondió con error HTTP "+res.status+" al pedir ventas");
    let data;
    try{ data = await res.json(); }
    catch(e){ throw new Error("La respuesta del backend no es JSON válido al pedir ventas"); }
    if(data && data.error) throw new Error("El backend devolvió un error: "+data.error);
    return data;
  }
};

function uid(p){ return p+"_"+Date.now()+"_"+Math.floor(Math.random()*9999); }

/* Formatea números con separador de miles (punto) y decimales (coma),
   como se usa en Bolivia. Ej: 22661 -> "22.661", 45.5 -> "45,5". */
function fmt(n){
  if(n===null || n===undefined || n==="" || isNaN(n)) return n===0?"0":(n||"");
  const num = Number(n);
  const esEntero = Number.isInteger(num);
  const partes = (esEntero ? num.toString() : num.toFixed(1)).split(".");
  partes[0] = partes[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  return partes.join(",");
}

/* Carga el stock de agosto (IMPORT_AGOSTO) como si ya hubiera sido relevado con la
   app: crea un almacén "Depósito Principal" por cliente (si no existe) y guarda el
   conteo ya aprobado. Es seguro volver a ejecutarlo: reemplaza el mismo almacén. */
function esperar(ms){ return new Promise(r=>setTimeout(r,ms)); }

async function guardarConReintentos(fn, intentos){
  intentos = intentos || 4;
  let ultimoError;
  for(let i=0;i<intentos;i++){
    try{ return await fn(); }
    catch(e){
      ultimoError = e;
      await esperar(600 * (i+1)); // espera un poco más en cada reintento
    }
  }
  throw ultimoError;
}

/* Algunos nombres del Excel de agosto no son clientes separados: son otro
   almacén de un cliente que ya existe con otro nombre. Acá se listan esos
   casos para que la importación los cargue como almacén adicional, en vez
   de crear un cliente nuevo. */
const ALMACENES_FUSIONADOS = {
  "CBBA": {
    "SANDRA TORRICO": { clientePadre: "MAURICIO SAUL AYALA", nombreAlmacen: "Sandra Torrico" },
    "JUANA ESPINOZA": { clientePadre: "MAURICIO SAUL AYALA", nombreAlmacen: "Juana Espinoza" },
  }
};

/* Código de cliente tal como figuraba en la planilla original de agosto,
   para los pocos casos donde sí estaba cargado ahí. Se usa para matchear
   por código antes que por nombre — así, aunque el nombre haya cambiado
   de escritura (ej. "TRALOCOM" vs "TRALOCOM S.R.L") igual encuentra al
   cliente correcto en la lista actual. */
const IMPORT_AGOSTO_CODIGOS = {"CBBA": {"MAGUA": "106757", "IS LOGISTIC": "106943", "BJ": "106201", "TSC": "106924", "TRALOCOM": "106992"}, "LPZ": {"JOSE LUIS GUTIERREZ": "210175", "UFMAGU": "210246", "ARMINIA MAMANI": "210014", "NORDIX": "209623", "JUAN CALLE": "209763"}, "SCZ": {}};

async function importarAgosto(onProgreso){
  const FECHA_IMPORT = "2026-08-01T12:00:00.000Z";
  let huboClientesNuevos = false;
  let hechos = 0, total = 0;
  const fallidos = [];
  Object.values(IMPORT_AGOSTO).forEach(cs=>{ total += Object.keys(cs).length; });

  for(const ciudad of Object.keys(IMPORT_AGOSTO)){
    const clientesCiudad = IMPORT_AGOSTO[ciudad];
    for(const nombreCliente of Object.keys(clientesCiudad)){
      const conteos = clientesCiudad[nombreCliente];
      const fusion = (ALMACENES_FUSIONADOS[ciudad]||{})[nombreCliente];
      const nombreClienteReal = fusion ? fusion.clientePadre : nombreCliente;
      const nombreAlmacenReal = fusion ? fusion.nombreAlmacen : "Depósito Principal";
      const codigoOriginal = (IMPORT_AGOSTO_CODIGOS[ciudad]||{})[nombreCliente];

      // 1) match por código (si esta fila tenía uno cargado en la planilla de agosto)
      let cliente = codigoOriginal
        ? STATE.clientes.find(c=>c.ciudad===ciudad && c.codigo && String(c.codigo).trim()===String(codigoOriginal).trim())
        : null;
      // 2) si no hubo código o no matcheó, probamos por nombre
      if(!cliente){
        cliente = STATE.clientes.find(c=>c.ciudad===ciudad && c.nombre.trim().toUpperCase()===nombreClienteReal.trim().toUpperCase());
      }
      if(!cliente){
        cliente = { id: uid("cli"), ciudad, nombre: nombreClienteReal, codigo:"", vendedor:"", vendedorTelefono:"", almacenes: [], ventasProm:{} };
        STATE.clientes.push(cliente);
        huboClientesNuevos = true;
      }
      cliente.almacenes = cliente.almacenes || [];
      let almacen = cliente.almacenes.find(a=>a.nombre===nombreAlmacenReal);
      if(!almacen){
        almacen = { id: uid("alm"), nombre: nombreAlmacenReal };
        cliente.almacenes.push(almacen);
        huboClientesNuevos = true;
      }
      const rel = getRelevamiento(almacen.id);
      rel.conteos = conteos;
      rel.fechaCreacion = rel.fechaCreacion || FECHA_IMPORT;
      rel.fechaConteo = FECHA_IMPORT;
      rel.relevadorNombre = "Importado desde Excel (agosto)";
      rel.clienteAcuerdo = true;
      rel.firmaTipo = "nombre";
      rel.firmaNombreTexto = "Importación inicial";
      rel.fechaFirma = FECHA_IMPORT;
      rel.estadoVendedor = "aprobado";
      try{
        await guardarConReintentos(()=>DB.saveRelevamiento(almacen.id, cliente.id, rel));
      }catch(e){
        console.error("Falló definitivamente:", nombreCliente, e);
        fallidos.push(nombreCliente);
      }
      hechos++;
      if(onProgreso) onProgreso(hechos, total, nombreCliente, fallidos.length);
      await esperar(250); // pequeña pausa entre pedidos para no saturar el backend
    }
  }
  if(huboClientesNuevos) await guardarConReintentos(()=>DB.saveClientes(STATE.clientes));
  return { hechos, total, fallidos };
}

function seedClientesFaltantes(){
  let huboCambios = false;
  CIUDADES.forEach(ciudad=>{
    const existentesPorNombre = {};
    STATE.clientes.filter(c=>c.ciudad===ciudad).forEach(c=>{ existentesPorNombre[c.nombre.toUpperCase()] = c; });
    (SEED_CLIENTES[ciudad]||[]).forEach(sc=>{
      const key = sc.nombre.toUpperCase();
      const existente = existentesPorNombre[key];
      if(!existente){
        STATE.clientes.push({ id: uid("cli"), ciudad, nombre: sc.nombre, codigo: sc.codigo||"", vendedor: sc.vendedor||"", vendedorTelefono: sc.telefono||"", almacenes: [], ventasProm:{} });
        huboCambios = true;
      } else {
        // Actualiza el dato maestro (código/vendedor/teléfono) si la lista base trae un valor
        // nuevo y distinto. Si la lista base viene vacía, no se pisa lo que ya haya cargado
        // un relevador a mano (por ejemplo, un dato que completó en el celular).
        if(sc.codigo && sc.codigo !== existente.codigo){ existente.codigo = sc.codigo; huboCambios = true; }
        if(sc.vendedor && sc.vendedor !== existente.vendedor){ existente.vendedor = sc.vendedor; huboCambios = true; }
        if(sc.telefono && sc.telefono !== existente.vendedorTelefono){ existente.vendedorTelefono = sc.telefono; huboCambios = true; }
      }
    });
  });
  return huboCambios;
}

function totalUnidades(rel){ return Object.values(rel.conteos||{}).reduce((a,b)=>a+(Number(b)||0),0); }
function clienteEstadoGeneral(cliente){
  const recs = (cliente.almacenes||[]).map(a=>STATE.relevamientos[a.id]).filter(Boolean);
  if(recs.length===0) return "sin_iniciar";
  if(recs.some(r=>r.estadoVendedor==="rechazado")) return "rechazado";
  if(recs.every(r=>r.estadoVendedor==="aprobado")) return "aprobado";
  if(recs.some(r=>r.estadoVendedor==="pendiente")) return "pendiente";
  return "en_progreso";
}
function badgeFor(estado){
  const map = {
    sin_iniciar:["Sin iniciar","badge-done"], en_progreso:["En progreso","badge-progress"],
    pendiente:["Pendiente aprobación","badge-pending"], aprobado:["Aprobado","badge-approved"],
    rechazado:["Rechazado","badge-rejected"],
  };
  return map[estado]||["-","badge-done"];
}

/* stock actual por SKU para un cliente (suma de todos sus almacenes) */
function stockPorSkuCliente(cliente){
  const stock = {};
  (cliente.almacenes||[]).forEach(a=>{
    const rel = STATE.relevamientos[a.id];
    if(!rel) return;
    Object.entries(rel.conteos||{}).forEach(([sku,q])=>{ stock[sku]=(stock[sku]||0)+(Number(q)||0); });
  });
  return stock;
}
/* días de stock = stock actual / (venta promedio mensual / 30) */
function diasStockSku(stockUnidades, ventaMensual){
  if(!ventaMensual || ventaMensual<=0) return null;
  return Math.round((stockUnidades / (ventaMensual/30))*10)/10;
}
function nivelRiesgo(dias){
  if(dias==null) return ["sin dato","badge-done"];
  if(dias < 7) return ["riesgo de quiebre","badge-red"];
  if(dias < 15) return ["stock bajo","badge-amber"];
  return ["cobertura ok","badge-green"];
}

function categoriasDesplegables(items, valueKey, dataAttr, relOrCliente){
  // Nivel 1: agrupar por marca (= Línea2). Nivel 2, dentro de cada una: por categoria (= Línea3).
  const porLinea2 = {};
  const ordenLinea2 = [];
  items.forEach(s=>{
    if(!porLinea2[s.marca]){ porLinea2[s.marca] = {}; ordenLinea2.push(s.marca); }
    if(!porLinea2[s.marca][s.categoria]) porLinea2[s.marca][s.categoria] = [];
    porLinea2[s.marca][s.categoria].push(s);
  });
  const tieneDatos = s => relOrCliente[valueKey] && relOrCliente[valueKey][s.id]!=null && relOrCliente[valueKey][s.id]!=="";

  return ordenLinea2.map(linea2=>{
    const gruposLinea3 = porLinea2[linea2];
    const todosLosSkusDeLinea2 = Object.values(gruposLinea3).flat();
    const conDatosLinea2 = todosLosSkusDeLinea2.filter(tieneDatos).length;
    return `<details class="cat-block cat-block-l2">
      <summary><span><span class="arrow">▸</span> ${linea2}</span><span class="count">${conDatosLinea2}/${todosLosSkusDeLinea2.length} con datos</span></summary>
      <div class="cat-body">
        ${Object.entries(gruposLinea3).map(([linea3, skus])=>{
          const conDatosLinea3 = skus.filter(tieneDatos).length;
          return `<details class="cat-block cat-block-l3" ${conDatosLinea3>0?'open':''}>
            <summary><span><span class="arrow">▸</span> ${linea3}</span><span class="count">${conDatosLinea3}/${skus.length} con datos</span></summary>
            <div class="cat-body">
              ${skus.map(s=>`<div class="sku-row">
                <div class="name"><span>${s.formatoMostrado}</span></div>
                <input type="number" min="0" inputmode="numeric" placeholder="0" data-${dataAttr}="${s.id}" value="${(relOrCliente[valueKey]&&relOrCliente[valueKey][s.id]!=null)?relOrCliente[valueKey][s.id]:''}">
              </div>`).join("")}
            </div>
          </details>`;
        }).join("")}
      </div>
    </details>`;
  }).join("");
}

function linkWhatsApp(telefono, mensaje){
  const limpio = String(telefono||"").replace(/\D/g,"");
  const numero = limpio.length===8 ? "591"+limpio : limpio; // celulares bolivianos: 8 dígitos + código de país 591
  return "https://wa.me/"+numero+"?text="+encodeURIComponent(mensaje);
}

/* Vista para el Administrador: quién relevó qué, y qué clientes ya tienen
   (o no) su relevamiento hecho — para tener control del avance del equipo. */
function screenCobertura(){
  const todos = STATE.clientes; // todas las ciudades, sin filtrar, para tener el panorama completo
  const filtroCiudad = STATE.coberturaFiltroCiudad || "TODAS";
  const clientesVista = filtroCiudad==="TODAS" ? todos : todos.filter(c=>c.ciudad===filtroCiudad);

  // resumen por relevador
  const porRelevador = {};
  todos.forEach(c=>{
    (c.almacenes||[]).forEach(a=>{
      const rel = STATE.relevamientos[a.id];
      if(!rel || !rel.relevadorNombre) return;
      const nombre = rel.relevadorNombre;
      porRelevador[nombre] = porRelevador[nombre] || { almacenes:0, fechaUltima:null };
      porRelevador[nombre].almacenes++;
      const f = rel.fechaConteo ? new Date(rel.fechaConteo) : null;
      if(f && (!porRelevador[nombre].fechaUltima || f>porRelevador[nombre].fechaUltima)) porRelevador[nombre].fechaUltima = f;
    });
  });
  const relevadores = Object.entries(porRelevador).sort((a,b)=>b[1].almacenes-a[1].almacenes);

  // cobertura de clientes: cuantos tienen al menos un almacen con conteo real
  const totalClientesVista = clientesVista.length;
  const cubiertos = clientesVista.filter(c=>clienteEstadoGeneral(c)!=="sin_iniciar").length;

  return `
  ${header("👥 Cobertura","Quién relevó y qué falta",false)}
  <main>
    <div class="city-filter-row">
      <div class="city-filter-chip ${filtroCiudad==='TODAS'?'active':''}" data-filtro-cobertura-ciudad="TODAS">Todas</div>
      ${CIUDADES.map(c=>`<div class="city-filter-chip ${filtroCiudad===c?'active':''}" data-filtro-cobertura-ciudad="${c}">${NOMBRES_CIUDAD[c]||c}</div>`).join("")}
    </div>

    <div class="card">
      <div class="metric"><span class="lbl">Clientes relevados</span><span class="val">${cubiertos} / ${totalClientesVista}</span></div>
    </div>

    <h2 class="section-title">Por relevador</h2>
    <div class="card">
      ${relevadores.length===0?`<div class="hint">Todavía nadie relevó nada.</div>`:
      relevadores.map(([nombre,info])=>`
        <div class="risk-item">
          <div><div class="name">${nombre}</div><div class="sub">${info.fechaUltima?"Último: "+info.fechaUltima.toLocaleDateString():""}</div></div>
          <span class="badge badge-approved">${info.almacenes} almacén(es)</span>
        </div>`).join("")}
    </div>

    <h2 class="section-title">Cobertura de clientes${filtroCiudad!=="TODAS"?" — "+(NOMBRES_CIUDAD[filtroCiudad]||filtroCiudad):""}</h2>
    <div class="card">
      ${clientesVista.length===0?`<div class="hint">No hay clientes para este filtro.</div>`:
      clientesVista.map(c=>{
        const est = clienteEstadoGeneral(c);
        const [label,cls] = badgeFor(est);
        const recs = (c.almacenes||[]).map(a=>STATE.relevamientos[a.id]).filter(Boolean);
        const relevadoPor = [...new Set(recs.map(r=>r.relevadorNombre).filter(Boolean))].join(", ");
        return `<div class="risk-item">
          <div><div class="name">${c.nombre} ${filtroCiudad==="TODAS"?`<span class="sub">(${c.ciudad})</span>`:""}</div><div class="sub">${relevadoPor||"sin relevar todavía"}</div></div>
          <span class="badge ${cls}">${label}</span>
        </div>`;
      }).join("")}
    </div>
  </main>
  ${tabbar('cobertura')}`;
}

async function abrirVentasDashboard(){
  STATE.screen = "ventasDashboard";
  render();
  if(!puedeVerVentas()) return;
  if(STATE.ventasCache) return; // ya está cargado, no lo repetimos cada vez que se entra
  STATE.ventasError = null;
  try{
    const data = await DB.getVentas();
    STATE.ventasCache = { ventas: data.ventas || {}, ventasPorLinea3: data.ventasPorLinea3 || {}, mesLabel: data.mesLabel || "" };
  }catch(e){
    STATE.ventasError = e.message || String(e);
  }
  render();
}

function nivelRiesgoVentas(dias){
  if(dias==null) return ["sin dato","badge-done"];
  if(dias < 7) return ["riesgo de quiebre","badge-red"];
  if(dias < 15) return ["stock bajo","badge-amber"];
  return ["cobertura ok","badge-green"];
}

function screenVentasDashboard(){
  if(!puedeVerVentas()){
    return `${header("Acceso restringido","",true,"clientes")}<main><div class="mini-note">🔒 Esta sección es solo para vendedores, comerciales y administradores.</div></main>`;
  }
  const puedeFiltrar = STATE.ciudad===NACIONAL;
  const filtro = puedeFiltrar ? STATE.dashboardFiltroCiudad : STATE.ciudad;
  const clientes = filtro==="TODAS" ? clientesDeMiCiudad() : STATE.clientes.filter(c=>c.ciudad===filtro);
  const filtroLinea = STATE.ventasFiltroLinea || "TODAS";

  const header1 = `
  <header class="top">
    <div class="mark">RS</div>
    <div class="titles">
      <h1>💰 Ventas y días de stock</h1>
      <div class="sub">${filtro==="TODAS"?nombreCiudad(STATE.ciudad):nombreCiudad(filtro)} · confidencial</div>
      <span class="dash-month">📅 ${mesActualLabel()}</span>
    </div>
  </header>`;

  if(STATE.ventasCache===null && !STATE.ventasError){
    return `${header1}<main><div class="empty"><div class="big">⏳</div>Cargando datos de venta…</div></main>${tabbar('ventas')}`;
  }
  if(STATE.ventasError){
    return `${header1}<main>
      <div class="mini-note" style="background:#f5e3e0;border-color:#dba79f;color:#7a2e2e;">❌ No se pudieron cargar las ventas: ${STATE.ventasError}</div>
      <button class="btn btn-primary" id="reintentarVentas">Reintentar</button>
    </main>${tabbar('ventas')}`;
  }

  const ventasPorCliente = (STATE.ventasCache && STATE.ventasCache.ventas) || {};
  const mesVentas = (STATE.ventasCache && STATE.ventasCache.mesLabel) || "";

  const filas = []; // {nombre, ciudad, linea, stock, ventaUnidades, dias}
  let huboStockSinVenta = false;
  clientes.forEach(c=>{
    const stockLinea = stockPorLineaCliente(c);
    const ventaLinea = ventasPorCliente[c.id] || {};
    Object.keys(stockLinea).forEach(linea=>{
      const venta = ventaLinea[linea];
      if(!venta){ huboStockSinVenta = true; return; }
      const dias = Math.round((stockLinea[linea]/(venta/30))*10)/10;
      filas.push({ nombre:c.nombre, ciudad:c.ciudad, linea, stock:stockLinea[linea], ventaUnidades:Math.round(venta), dias });
    });
  });
  filas.sort((a,b)=>a.dias-b.dias);

  const porCiudad = {};
  filas.forEach(f=>{ porCiudad[f.ciudad] = porCiudad[f.ciudad]||[]; porCiudad[f.ciudad].push(f.dias); });

  const lineasDisponibles = Object.keys(LINEA2_A_LINEA3).sort();
  const resumenLineas = LINEAS_PRINCIPALES.map(linea=>{
    const filasLinea = filas.filter(f=>f.linea===linea);
    if(filasLinea.length===0) return { linea, stock:0, venta:0, dias:null };
    const stock = filasLinea.reduce((a,f)=>a+f.stock,0);
    const venta = filasLinea.reduce((a,f)=>a+f.ventaUnidades,0);
    const dias = Math.round((stock/(venta/30))*10)/10;
    return { linea, stock, venta, dias };
  });

  // Detalle por línea 3, dentro de la línea2 elegida
  let detalleLinea3 = [];
  if(filtroLinea!=="TODAS"){
    const linea3sCatalogo = LINEA2_A_LINEA3[filtroLinea] || [];
    const ventasPorLinea3 = (STATE.ventasCache && STATE.ventasCache.ventasPorLinea3) || {};
    linea3sCatalogo.forEach(linea3=>{
      clientes.forEach(c=>{
        const stockL3 = stockPorLinea3Cliente(c, filtroLinea);
        const stockCliente = stockL3[linea3];
        if(!stockCliente) return;
        const ventaL3 = ((ventasPorLinea3[c.id]||{})[filtroLinea]) || {};
        const ventaCliente = ventaL3[linea3];
        const dias = ventaCliente ? Math.round((stockCliente/(ventaCliente/30))*10)/10 : null;
        detalleLinea3.push({ linea3, nombre:c.nombre, ciudad:c.ciudad, stock:stockCliente, venta:ventaCliente?Math.round(ventaCliente):null, dias });
      });
    });
    detalleLinea3.sort((a,b)=> (a.dias==null?999:a.dias)-(b.dias==null?999:b.dias));
  }

  return `
  ${header1}
  <main>
    ${puedeFiltrar ? `
    <h2 class="section-title">Ciudad</h2>
    <div class="city-filter-row">
      <div class="city-filter-chip ${filtro==='TODAS'?'active':''}" data-filtro-ciudad="TODAS">Todas</div>
      ${CIUDADES.map(c=>`<div class="city-filter-chip ${filtro===c?'active':''}" data-filtro-ciudad="${c}">${NOMBRES_CIUDAD[c]||c}</div>`).join("")}
    </div>` : ``}

    <h2 class="section-title">Línea</h2>
    <select id="ventasFiltroLineaSelect" style="margin-bottom:16px;">
      <option value="TODAS" ${filtroLinea==="TODAS"?"selected":""}>Todas las líneas (resumen)</option>
      ${lineasDisponibles.map(l=>`<option value="${l}" ${filtroLinea===l?"selected":""}>${l}</option>`).join("")}
    </select>

    <div class="mini-note">🔒 Esta información es confidencial: solo la ven vendedores, comerciales y administradores. Las ventas se cargan pegando el reporte mensual directo en Google Sheets (hoja "Ventas"), nunca desde esta app. El cruce es por línea de producto${mesVentas?" · venta cargada: "+mesVentas:""}.</div>

    ${Object.keys(porCiudad).length>1 ? `
    <h2 class="section-title">Días de stock promedio por regional</h2>
    <div class="card">
      ${Object.entries(porCiudad).map(([ciudad,arr])=>{
        const prom = Math.round((arr.reduce((a,b)=>a+b,0)/arr.length)*10)/10;
        const [lbl,cls] = nivelRiesgoVentas(prom);
        return `<div class="risk-item"><div><div class="name">${NOMBRES_CIUDAD[ciudad]||ciudad}</div><div class="sub">${arr.length} línea(s) con dato</div></div><span class="badge ${cls}">${fmt(prom)} días</span></div>`;
      }).join("")}
    </div>` : ``}

    <h2 class="section-title">Resumen — líneas principales</h2>
    <div class="card">
      ${resumenLineas.map(r=>{
        const [lbl,cls] = nivelRiesgoVentas(r.dias);
        return `<div class="risk-item">
          <div><div class="name">${r.linea}</div><div class="sub">${r.dias!=null?`Stock ${fmt(r.stock)} u. · Venta ${fmt(r.venta)} u./mes`:"sin datos"}</div></div>
          <span class="badge ${cls}">${r.dias!=null?fmt(r.dias)+" días":"—"}</span>
        </div>`;
      }).join("")}
    </div>

    ${filtroLinea!=="TODAS"?`
    <h2 class="section-title">Detalle por línea 3 — ${filtroLinea}</h2>
    <div class="card">
      ${(LINEA2_A_LINEA3[filtroLinea]||[]).length===0?`<div class="hint">Esta línea no tiene un desglose de línea 3 cargado en el catálogo.</div>`:
      detalleLinea3.length===0?`<div class="hint">Ninguno de los clientes relevados tiene stock en esta línea todavía.</div>`:
      (()=>{
        let ultimaLinea3 = null;
        return detalleLinea3.map(f=>{
          const [lbl,cls] = nivelRiesgoVentas(f.dias);
          const nuevoGrupo = f.linea3!==ultimaLinea3;
          ultimaLinea3 = f.linea3;
          return `${nuevoGrupo?`<div style="font-weight:700;font-size:12.5px;color:var(--brand-dark);margin:${detalleLinea3.indexOf(f)===0?"0":"14px"} 0 6px;">▸ ${f.linea3}</div>`:""}
          <div class="risk-item">
            <div><div class="name">${f.nombre}${filtro==="TODAS"?` <span class="sub">(${f.ciudad})</span>`:""}</div><div class="sub">Stock ${fmt(f.stock)} u.${f.venta!=null?` · Venta ${fmt(f.venta)} u./mes`:""}</div></div>
            <span class="badge ${cls}">${f.dias!=null?fmt(f.dias)+" días":"sin venta cargada"}</span>
          </div>`;
        }).join("");
      })()}
    </div>` : ``}
    ${huboStockSinVenta?`<div class="hint" style="text-align:center;">Algunas líneas con stock relevado todavía no tienen venta cargada para este mes — no se les calculó días de stock.</div>`:``}
  </main>
  ${tabbar('ventas')}`;
}

function claseDias(dias){
  if(dias==null) return "gray";
  if(dias<7) return "red";
  if(dias<15) return "amber";
  return "green";
}

function screenDashboard(){
  const puedeFiltrarCiudad = STATE.ciudad===NACIONAL; // Gerencia Nacional / Administrador
  const filtroCiudad = puedeFiltrarCiudad ? STATE.dashboardFiltroCiudad : STATE.ciudad;
  const ciudadParaHistorico = filtroCiudad==="TODAS" ? STATE.ciudad : filtroCiudad;
  const filtroMes = STATE.dashboardFiltroMes || "ACTUAL";
  const filtroLinea = STATE.dashboardFiltroCategoria || "TODAS"; // nombre de STATE sin cambiar para no romper nada; ahora guarda una línea
  const esActual = filtroMes==="ACTUAL";

  let totalStockCiudad = 0;
  let porLinea = {};
  const porCiudad = {};
  const stockPorCliente = []; // {nombre, ciudad, stock}
  let pendientesAprobacion = 0;
  let relevadosEsteMes = 0;
  const hoy = Date.now();

  if(esActual){
    const clientes = filtroCiudad==="TODAS" ? clientesDeMiCiudad() : STATE.clientes.filter(c=>c.ciudad===filtroCiudad);
    clientes.forEach(c=>{
      const stock = stockPorSkuCliente(c);
      let stockCliente=0;
      Object.entries(stock).forEach(([skuId,qty])=>{
        const linea = SKU_A_LINEA[skuId] || "Sin línea asignada";
        if(filtroLinea!=="TODAS" && linea!==filtroLinea) return;
        totalStockCiudad += qty;
        stockCliente += qty;
        porCiudad[c.ciudad] = (porCiudad[c.ciudad]||0)+qty;
        porLinea[linea] = (porLinea[linea]||0)+qty;
      });
      if(stockCliente>0) stockPorCliente.push({ nombre:c.nombre, ciudad:c.ciudad, stock:stockCliente });
      (c.almacenes||[]).forEach(a=>{
        const rel = STATE.relevamientos[a.id];
        if(!rel) return;
        if(rel.estadoVendedor==="pendiente") pendientesAprobacion++;
        if(rel.fechaConteo && (hoy-new Date(rel.fechaConteo).getTime())/86400000<=30) relevadosEsteMes++;
      });
    });
  } else {
    // mes histórico: solo tenemos totales por línea (de la planilla Trade Stock), sin detalle por cliente
    porLinea = stockPorLineaHistorico(filtroCiudad==="TODAS"?ciudadParaHistorico:filtroCiudad, filtroMes);
    if(filtroLinea!=="TODAS"){
      porLinea = Object.fromEntries(Object.entries(porLinea).filter(([l])=>l===filtroLinea));
    }
    totalStockCiudad = Object.values(porLinea).reduce((a,b)=>a+b,0);
  }

  stockPorCliente.sort((a,b)=>b.stock-a.stock);
  const maxCat = Math.max(1,...Object.values(porLinea));
  const maxCiudad = Math.max(1,...Object.values(porCiudad));

  const puedeMostrarDias = esActual && puedeVerVentas() && STATE.ventasCache;
  const clientesParaVenta = filtroCiudad==="TODAS" ? clientesDeMiCiudad() : STATE.clientes.filter(c=>c.ciudad===filtroCiudad);
  let mesVentas = "", ventaTotalFiltro = 0;
  const diasPorLinea = {};
  if(puedeMostrarDias){
    const ventasPorCliente = STATE.ventasCache.ventas || {};
    mesVentas = STATE.ventasCache.mesLabel || "";
    Object.keys(porLinea).forEach(linea=>{
      let ventaLinea = 0;
      clientesParaVenta.forEach(c=>{ const v = ventasPorCliente[c.id]; if(v && v[linea]) ventaLinea += v[linea]; });
      diasPorLinea[linea] = ventaLinea>0 ? Math.round((porLinea[linea]/(ventaLinea/30))*10)/10 : null;
    });
    clientesParaVenta.forEach(c=>{
      const v = ventasPorCliente[c.id];
      if(v) Object.values(v).forEach(u=>{ ventaTotalFiltro += u; });
    });
  }
  const lineasConDias = Object.values(diasPorLinea).filter(d=>d!=null);
  const diasPromedio = lineasConDias.length ? Math.round((lineasConDias.reduce((a,b)=>a+b,0)/lineasConDias.length)*10)/10 : null;
  const pctSano = lineasConDias.length ? Math.round((lineasConDias.filter(d=>d>=15).length/lineasConDias.length)*100) : null;

  const hist = esActual ? historicoParaCiudad(ciudadParaHistorico) : null;
  const diasEvolucion = hist ? hist.map(v => (puedeMostrarDias && ventaTotalFiltro>0) ? Math.round((v/(ventaTotalFiltro/30))*10)/10 : null) : null;

  return `
  <main style="padding:0 0 90px;">
  <div class="dash2-header">
    <div class="t">Dashboard comercial</div>
    <div class="s">${filtroCiudad==="TODAS"?nombreCiudad(STATE.ciudad):nombreCiudad(filtroCiudad)} · ${esActual?mesActualLabel():filtroMes+" 2026 (histórico)"}</div>
  </div>
  <div class="dash2-filters">
    ${puedeFiltrarCiudad?`<select id="dash2Ciudad">
      <option value="TODAS" ${filtroCiudad==='TODAS'?'selected':''}>Todas</option>
      ${CIUDADES.map(c=>`<option value="${c}" ${filtroCiudad===c?'selected':''}>${NOMBRES_CIUDAD[c]||c}</option>`).join("")}
    </select>`:``}
    <select id="dash2Mes">
      ${MESES_DASHBOARD.map(m=>`<option value="${m}" ${filtroMes===m?'selected':''}>${m==="ACTUAL"?"AGO (en vivo)":m}</option>`).join("")}
    </select>
  </div>
  <div class="dash2-filters" style="margin-top:0;">
    <select id="filtroCategoriaSelect" style="flex:1;">
      <option value="TODAS" ${filtroLinea==="TODAS"?"selected":""}>Todas las líneas</option>
      ${lineasDisponiblesDashboard().map(l=>`<option value="${l}" ${filtroLinea===l?"selected":""}>${l}</option>`).join("")}
    </select>
  </div>

  <div class="dash2-metrics">
    <div class="dash2-metric">
      <div class="ic" style="background:#e5f6ef;">⏱️</div>
      <div class="lbl">Días stock prom.</div>
      <div class="val">${diasPromedio!=null?fmt(diasPromedio):"—"}</div>
      <div class="trend" style="color:#8a94a3;">${diasPromedio==null?"sin venta cargada":""}</div>
    </div>
    <div class="dash2-metric">
      <div class="ic" style="background:#fff1e0;">📦</div>
      <div class="lbl">Total unidades</div>
      <div class="val">${fmt(totalStockCiudad)}</div>
      <div class="trend" style="color:#8a94a3;">${filtroMes}</div>
    </div>
    <div class="dash2-metric">
      <div class="ic" style="background:#eaf0fd;">🏬</div>
      <div class="lbl">${esActual?"Pendientes":"Relevados 30d"}</div>
      <div class="val">${esActual?pendientesAprobacion:relevadosEsteMes}</div>
      <div class="trend" style="color:#8a94a3;">${esActual?"aprobación":"últimos 30 días"}</div>
    </div>
  </div>

  ${!puedeVerVentas()?``:!STATE.ventasCache?`<div class="mini-note" style="margin:0 18px 14px;">🔒 Los días de stock son confidenciales. Entrá primero a "💰 Ventas" para verlos también acá.</div>`:``}

  ${esActual && hist ? (()=>{
    const esCombinado = ["ORURO","POTOSI","SUCRE","TARIJA"].includes(ciudadParaHistorico);
    const maxH = Math.max(...hist,1);
    const puntos = hist.map((v,i)=>{ const x=30+i*80; const y=90-(v/maxH*70); return {x,y,v,d:diasEvolucion[i]}; });
    const polyline = puntos.map(p=>`${p.x},${p.y}`).join(" ");
    return `
  <div class="dash2-card">
    <div class="title">Evolución del stock ${puedeMostrarDias?"y días de cobertura":""}</div>
    ${esCombinado?`<div class="hint" style="margin-bottom:8px;">Dato combinado de Oruro + Potosí + Sucre + Tarija.</div>`:""}
    <svg viewBox="0 0 300 110" style="width:100%;display:block;">
      <line x1="0" y1="90" x2="300" y2="90" stroke="#eef1f5" stroke-width="1"></line>
      ${puntos.map((p,i)=>`<rect x="${p.x-16}" y="${90-(p.v/maxH*55)}" width="32" height="${(p.v/maxH*55)}" rx="4" fill="${i===puntos.length-1?'#0e8f6f':'#bcd8cd'}"></rect>`).join("")}
      ${puedeMostrarDias?`<polyline points="${polyline}" fill="none" stroke="#2f5fd8" stroke-width="2.5"></polyline>
      ${puntos.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="${i===puntos.length-1?5:4}" fill="${p.d!=null&&p.d<7?'#d81f1f':'#2f5fd8'}"></circle>${p.d!=null?`<text x="${p.x}" y="${p.y-8}" text-anchor="middle" font-size="10" font-weight="700" fill="${p.d<7?'#d81f1f':'#152a4a'}">${fmt(p.d)}d</text>`:``}`).join("")}`:``}
      ${HISTORICO_MENSUAL.meses.map((m,i)=>`<text x="${30+i*80}" y="104" text-anchor="middle" font-size="10" fill="#98a2b3">${m}</text>`).join("")}
    </svg>
    <div class="hint" style="margin-top:6px;">Barras = unidades (planilla Trade Stock).${puedeMostrarDias?` Línea = días de stock (mayo/junio/julio son una estimación con el ritmo de venta de ${mesVentas||"el mes cargado"}).`:""}</div>
  </div>`;
  })() : ``}

  ${esActual && filtroCiudad==="TODAS" ? `
  <div class="dash2-card">
    <div class="title">Días de stock por ciudad</div>
    <div style="display:flex;gap:6px;">
      ${CIUDADES.filter(c=>porCiudad[c]).map(c=>{
        const dias = puedeMostrarDias ? (()=>{
          let v=0; const vp = STATE.ventasCache.ventas||{};
          STATE.clientes.filter(cl=>cl.ciudad===c).forEach(cl=>{ const vv=vp[cl.id]; if(vv) Object.values(vv).forEach(u=>{v+=u;}); });
          return v>0 ? Math.round((porCiudad[c]/(v/30))*10)/10 : null;
        })() : null;
        const cls = claseDias(dias);
        const bgMap = {red:"#ffe0e0",amber:"#fff5df",green:"#e5f6ef",gray:"#eef1f5"};
        const txtMap = {red:"#a31f1f",amber:"#a3730a",green:"#0e8f6f",gray:"#8a94a3"};
        return `<div class="city-mini" style="background:${bgMap[cls]};">
          <div class="lbl" style="color:${txtMap[cls]};">${NOMBRES_CIUDAD[c]||c}</div>
          <div class="val">${dias!=null?fmt(dias):fmt(porCiudad[c])}</div>
        </div>`;
      }).join("")}
    </div>
  </div>` : ``}

  <div class="dash2-card">
    <div class="title">Stock por línea${filtroLinea!=="TODAS"?" — "+filtroLinea:""}${puedeMostrarDias?" y días de cobertura":""}</div>
    ${Object.keys(porLinea).length===0?`<div class="hint">Sin datos para este filtro.</div>`:
    Object.entries(porLinea).sort((a,b)=>b[1]-a[1]).map(([l,qty])=>{
      const dias = diasPorLinea[l];
      const cls = claseDias(dias);
      const abierto = filtroLinea===l;
      return `
      <div class="linea2-row ${abierto?'open':''}" data-toggle-linea="${l}">
        <span style="font-size:12px;font-weight:700;color:#152a4a;">${abierto?'▾':'▸'} ${l}</span>
        <span style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:11px;color:#8a94a3;">${fmt(qty)} u.</span>
          ${puedeMostrarDias?`<span class="dias-badge ${cls}">${dias!=null?fmt(dias)+" días":"sin venta"}</span>`:``}
        </span>
      </div>
      ${abierto ? (()=>{
        const clientesParaL3 = clientesParaVenta;
        const porLinea3 = {};
        clientesParaL3.forEach(c=>{ const s = stockPorLinea3Cliente(c, l); Object.entries(s).forEach(([l3,q])=>{ porLinea3[l3]=(porLinea3[l3]||0)+q; }); });
        const linea3sCatalogo = LINEA2_A_LINEA3[l] || [];
        const ventasPorLinea3 = (STATE.ventasCache && STATE.ventasCache.ventasPorLinea3) || {};
        if(linea3sCatalogo.length===0) return `<div class="hint linea3-sub">Sin desglose de línea 3 para esta línea.</div>`;
        if(Object.keys(porLinea3).length===0) return `<div class="hint linea3-sub">Ningún cliente relevado tiene stock acá todavía.</div>`;
        return `<div class="linea3-sub">${Object.entries(porLinea3).sort((a,b)=>b[1]-a[1]).map(([l3,q])=>{
          let ventaL3 = 0;
          if(puedeMostrarDias) clientesParaL3.forEach(c=>{ const vv=((ventasPorLinea3[c.id]||{})[l]||{})[l3]; if(vv) ventaL3+=vv; });
          const diasL3 = puedeMostrarDias && ventaL3>0 ? Math.round((q/(ventaL3/30))*10)/10 : null;
          const clsL3 = claseDias(diasL3);
          return `<div class="linea3-item">
            <div style="flex:1;min-width:0;">
              <div style="font-size:11.5px;font-weight:700;color:#152a4a;">${l3}</div>
              <div style="font-size:10px;color:#98a2b3;">Stock ${fmt(q)} u.${ventaL3>0?` · Venta ${fmt(Math.round(ventaL3))} u./mes`:``}</div>
            </div>
            ${puedeMostrarDias?`<span class="dias-badge ${clsL3}">${diasL3!=null?fmt(diasL3)+"d":"—"}</span>`:``}
          </div>`;
        }).join("")}</div>`;
      })() : ``}`;
    }).join("")}
  </div>

  ${puedeMostrarDias && pctSano!=null ? `
  <div class="dash2-card" style="text-align:center;">
    <div class="title" style="text-align:left;">Cobertura general</div>
    ${(()=>{
      const r=30, C=2*Math.PI*r;
      const sano = C*(pctSano/100), resto = C-sano;
      return `<svg viewBox="0 0 80 80" width="90" height="90">
        <circle cx="40" cy="40" r="${r}" fill="none" stroke="#ffe0e0" stroke-width="11"></circle>
        <circle cx="40" cy="40" r="${r}" fill="none" stroke="#0e8f6f" stroke-width="11" stroke-dasharray="${sano} ${resto}" stroke-linecap="round" transform="rotate(-90 40 40)"></circle>
        <text x="40" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="#152a4a">${pctSano}%</text>
        <text x="40" y="49" text-anchor="middle" font-size="7" fill="#98a2b3">≥15 días</text>
      </svg>`;
    })()}

/* ---------------------------------------------------------------

--------------------------------------------------------------- */
function handleFile(file, cb){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      const maxW = 640;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement("canvas");
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      cb(canvas.toDataURL("image/jpeg",0.45));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

   FIRMA (canvas)
--------------------------------------------------------------- */
let sigCtx=null, sigDrawing=false, sigHas=false;
function setupSignaturePad(){
  const canvas = document.getElementById("sigPad");
  if(!canvas) return;
  const ratio = window.devicePixelRatio||1;
  canvas.width = canvas.clientWidth*ratio;
  canvas.height = canvas.clientHeight*ratio;
  sigCtx = canvas.getContext("2d");
  sigCtx.scale(ratio,ratio);
  sigCtx.lineWidth=2.4; sigCtx.lineCap="round"; sigCtx.strokeStyle="#1c2b24";
  sigHas=false;
  function pos(e){ const r = canvas.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return {x:t.clientX-r.left, y:t.clientY-r.top}; }
  function start(e){ sigDrawing=true; sigHas=true; const p=pos(e); sigCtx.beginPath(); sigCtx.moveTo(p.x,p.y); e.preventDefault(); }
  function move(e){ if(!sigDrawing) return; const p=pos(e); sigCtx.lineTo(p.x,p.y); sigCtx.stroke(); e.preventDefault(); }
  function end(){ sigDrawing=false; }
  canvas.addEventListener("mousedown",start); canvas.addEventListener("mousemove",move); window.addEventListener("mouseup",end);
  canvas.addEventListener("touchstart",start,{passive:false}); canvas.addEventListener("touchmove",move,{passive:false}); canvas.addEventListener("touchend",end);
}
function clearSignature(){ const canvas = document.getElementById("sigPad"); if(!canvas||!sigCtx) return; sigCtx.clearRect(0,0,canvas.width,canvas.height); sigHas=false; }
function hasSignature(){ return sigHas; }
function getSignatureDataUrl(){ return document.getElementById("sigPad").toDataURL("image/png"); }

function generarImagenNombre(nombre){
  const canvas = document.createElement("canvas");
  canvas.width = 600; canvas.height = 200;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fdfcf9"; ctx.fillRect(0,0,600,200);
  ctx.strokeStyle = "#d8d2c2"; ctx.lineWidth=2; ctx.strokeRect(1,1,598,198);
  ctx.fillStyle = "#1c2b24";
  ctx.font = "italic 40px Georgia, 'Times New Roman', serif";
  ctx.textBaseline = "middle";
  ctx.fillText(nombre || "", 24, 95, 552);
  ctx.font = "12px sans-serif"; ctx.fillStyle = "#8a9188";
  ctx.fillText("Confirmado escribiendo el nombre — " + new Date().toLocaleString(), 24, 160, 552);
  return canvas.toDataURL("image/png");
}

function mesActualAbrev(){

}

/* Genera la hoja de una ciudad con el mismo layout que la planilla base:
   fila1 = VENDEDOR (por columna de cliente), fila2 = código de cliente,
   fila3 = encabezados de producto + nombre de cliente, filas siguientes = catálogo. */
function buildCitySheetRows(clientesCiudad, ciudad){
  const porVendedor = {};
  clientesCiudad.forEach(c=>{
    const v = c.vendedor || "Sin vendedor";
    porVendedor[v] = porVendedor[v]||[];
    porVendedor[v].push(c);
  });

  const filaVendedor = ["","","","","","VENDEDOR"];
  const filaCodigo = ["codigo de cliente","","","","","",];
  const filaHeader = ["N°","Marca","Categoría","Formato","Observaciones","LINEA 3"];
  const colClientes = [];
  Object.entries(porVendedor).forEach(([vendedor, clientes])=>{
    clientes.forEach(c=>{
      filaVendedor.push(vendedor);
      filaCodigo.push(c.codigo || "");
      filaHeader.push(c.nombre);
      colClientes.push(c);
    });
  });
  filaVendedor.push("");
  filaCodigo.push("");
  filaHeader.push("TOTAL STOCK "+mesActualAbrev());

  const histSku = histSkuParaCiudad(ciudad);
  const mesesHist = ["JUL","JUN","MAY"]; // los 3 meses anteriores al actual, tal como en la planilla base
  if(histSku){
    mesesHist.forEach(m=>{ filaVendedor.push(""); filaCodigo.push(""); filaHeader.push("TOTAL STOCK "+m); });
  }

  const rows = [filaVendedor, filaCodigo, filaHeader];
  SKU_CATALOG.forEach(s=>{
    const marcaCelda = s.marcaShown ? s.marca : "";
    const linea3 = (s.categoria+" "+s.formato).trim();
    const row = [s.n, marcaCelda, s.categoria, s.formato, s.observaciones, linea3];
    let totalFila = 0;
    colClientes.forEach(c=>{
      const stock = stockPorSkuCliente(c);
      const val = stock[s.id] || 0;
      totalFila += val;
      row.push(val || "");
    });
    row.push(totalFila || "");
    if(histSku){
      const datosSku = histSku[String(s.n)];
      mesesHist.forEach(m=>{ row.push(datosSku && datosSku[m] ? datosSku[m] : ""); });
    }
    rows.push(row);
  });
  return rows;
}

function exportarExcel(){
  const wb = XLSX.utils.book_new();
  const esNacional = STATE.ciudad===NACIONAL;
  const ciudadesAExportar = esNacional ? CIUDADES : [STATE.ciudad];
  const clientesAExportar = esNacional ? STATE.clientes : STATE.clientes.filter(c=>c.ciudad===STATE.ciudad);

  ciudadesAExportar.forEach(ciudad=>{
    const clientesCiudad = STATE.clientes.filter(c=>c.ciudad===ciudad);
    if(clientesCiudad.length===0) return;
    const rows = buildCitySheetRows(clientesCiudad, ciudad);
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), ciudad);
  });

  const detalle = [["Ciudad","Cliente","Vendedor","Almacén","Fecha conteo","Relevador","Latitud","Longitud","Precisión (m)","Fotos vigentes","Fotos eliminadas por vencimiento","Cliente conforme","Tipo de firma","Firma registrada","Estado vendedor"]];
  clientesAExportar.forEach(c=>{
    (c.almacenes||[]).forEach(a=>{
      const r = STATE.relevamientos[a.id] || {};
      detalle.push([
        c.ciudad, c.nombre, c.vendedor||"", a.nombre,
        r.fechaConteo? new Date(r.fechaConteo).toLocaleString():"",
        r.relevadorNombre||"",
        r.gps? r.gps.lat:"", r.gps? r.gps.lng:"", r.gps? Math.round(r.gps.acc):"",
        r.fotos? r.fotos.filter(Boolean).length:0,
        r.fotosEliminadas? "Sí":"No",
        r.clienteAcuerdo===true?"Sí":r.clienteAcuerdo===false?"No":"",
        r.firmaTipo==="nombre"?"Nombre escrito":r.firmaTipo==="dibujo"?"Firma en pantalla":"",
        r.firmaImg?"Sí":"No",
        r.estadoVendedor||"borrador",
      ]);
    });
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(detalle), "Detalle");

  const dash = [["Ciudad","Cliente","Vendedor","Stock total (u.)"]];
  clientesAExportar.forEach(c=>{
    const stock = stockPorSkuCliente(c);
    const stockTotal = Object.values(stock).reduce((a,b)=>a+b,0);
    dash.push([c.ciudad, c.nombre, c.vendedor||"", stockTotal]);
  });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(dash), "Resumen stock");

  const nombreArchivo = "Relevamiento_"+(esNacional?"TODAS_LAS_CIUDADES":STATE.ciudad)+"_"+new Date().toISOString().slice(0,10)+".xlsx";
  XLSX.writeFile(wb, nombreArchivo);
}

/* ---------------------------------------------------------------
   INIT
--------------------------------------------------------------- */
(async function init(){
  try{
    await loadAll();
    render();
  }catch(err){
    console.error("Error al iniciar la app:", err);
    document.getElementById("app").innerHTML = `
      <div style="padding:24px;font-family:sans-serif;">
        <h2 style="color:#a63a3a;">No se pudo conectar con el backend</h2>
        <p>${(err&&err.message)?err.message:String(err)}</p>
        <p style="color:#6b756f;font-size:13px;">Revisá que la URL en <code>API_URL</code> sea correcta y que la implementación de Apps Script tenga acceso "Cualquier usuario". Sacale una captura a esta pantalla y mandásela a soporte.</p>
        <button onclick="location.reload()" style="margin-top:10px;padding:10px 16px;border:none;border-radius:8px;background:#2f5d4f;color:#fff;font-weight:700;">Reintentar</button>
      </div>`;
  }
})();
</script>
